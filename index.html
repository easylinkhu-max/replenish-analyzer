<script>
/* ============================================================
 * 核心模块 ReplenishModule（可整体复制到你的网站复用）
 * API:
 *   parse(text) -> [sku]                解析粘贴文本
 *   analyze(sku, params, baseDate) -> res  核心计算（可直接传结构化数据对象，绕过 parse）
 *   planA/B/planAir(res, params) -> plan  三方案（海/空/组合）
 *   toMarkdown(res, plans) -> string    生成 Markdown
 * ============================================================ */
const ReplenishModule = (function () {

  const SEA_DEFAULT = 25;   // 海运填 0（未启用）时方案一仍按此默认值估算（成本基准）
  const STALE_DAYS = 90;    // 在途超 3 个月未提货 → 列出但忽略不计

  /* ---------- 日期工具 ---------- */
  function parseDate(s) {
    if (!s) return null;
    const m = String(s).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + Math.ceil(n)); return x; }
  function dayDiff(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }
  function fmt(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtMD(d) { return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const sum = (arr, k) => arr.reduce((s, b) => s + b[k], 0);

  /* ---------- 解析 ---------- */
  function parse(text) {
    const skus = [];
    const parts = String(text).split(/===SKU/i);
    for (let p of parts) {
      p = p.replace(/^[：:]\s*\S+\s*=*/, "").trim();
      if (!p) continue;
      const sku = parseOne(p);
      if (sku.code || sku.daily7) skus.push(sku);
    }
    return skus;
  }
  function parseOne(block) {
    const sku = { code: "", daily7: 0, daily30: 0, changeRate: 0, available: 0, sellDays: 0, sales7: 0, inTransit: [] };
    for (const raw of block.split("\n")) {
      const line = raw.trim();
      let m;
      if ((m = line.match(/^SKU\s*[：:]\s*(\S+)/))) sku.code = m[1];
      else if ((m = line.match(/日均7天\s*[：:]\s*([\d.]+)/))) sku.daily7 = parseFloat(m[1]);
      else if ((m = line.match(/日均30天\s*[：:]\s*([\d.]+)/))) sku.daily30 = parseFloat(m[1]);
      else if ((m = line.match(/日均变化率\s*[：:]\s*([+\-]?[\d.]+)/))) sku.changeRate = parseFloat(m[1]);
      else if ((m = line.match(/可用库存\s*[：:]\s*([\d.]+)/))) sku.available = parseFloat(m[1]);
      else if ((m = line.match(/可售天数\s*[：:]\s*([\d.]+)/))) sku.sellDays = parseFloat(m[1]);
      else if ((m = line.match(/销量7天\s*[：:]\s*([\d.]+)/))) sku.sales7 = parseFloat(m[1]);
      else if ((m = line.match(/^\s*[-*]\s*([^：:\s]+)\s*[：:]\s*在途\s*(\d+)\s*件/))) {
        const pd = line.match(/采购时间\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const eta = line.match(/预计到货\s*[≈=~]?\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const ts = line.match(/运输时效\s*(\d+)/);
        sku.inTransit.push({ method: m[1], qty: parseInt(m[2]), purchaseDate: pd ? pd[1] : "", eta: eta ? eta[1] : "", transitDays: ts ? parseInt(ts[1]) : 0 });
      }
    }
    if (!sku.daily7 && sku.sales7) sku.daily7 = sku.sales7 / 7;
    return sku;
  }

  /* ---------- 核心计算 ---------- */
  function analyze(sku, params, baseDate) {
    const d = sku.daily7;
    if (!d || d <= 0) return { error: "SKU " + (sku.code || "") + " 日均7天缺失或为0，无法计算" };
    const today = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());

    const overdue = [], upcoming = [], anomaly = [];
    for (const b of sku.inTransit) {
      // 采购超 3 个月仍未提货 → 列出但忽略不计（不进时间轴、不计入方案）
      const pdDate = parseDate(b.purchaseDate);
      const age = pdDate ? dayDiff(today, pdDate) : null;
      if (age !== null && age > STALE_DAYS) {
        anomaly.push(Object.assign({}, b, { stale: true, reason: "采购 " + fmt(pdDate) + "，已 " + age + " 天未提货（超 3 个月），忽略不计" }));
        continue;
      }
      const eta = parseDate(b.eta);
      if (!eta) { anomaly.push(Object.assign({}, b, { reason: b.eta ? "预计到货日期格式异常" : "无预计到货日期" })); continue; }
      if (eta <= today) overdue.push(Object.assign({}, b, { etaDate: eta })); else upcoming.push(Object.assign({}, b, { etaDate: eta }));
    }
    upcoming.sort((a, b) => a.etaDate - b.etaDate);
    overdue.sort((a, b) => (parseDate(a.purchaseDate) || today) - (parseDate(b.purchaseDate) || today));
    const overdueQty = sum(overdue, "qty");

    const rows = [];
    let stock = sku.available;
    const firstUseBy = addDays(today, stock / d);
    rows.push({ kind: "current", qty: Math.round(stock), arrive: today, useBy: firstUseBy });

    for (const b of overdue) {
      stock += b.qty;
      rows.push({ kind: "overdue", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate || today, useBy: addDays(today, stock / d) });
    }

    let curDate = today;
    for (const b of upcoming) {
      const days = dayDiff(b.etaDate, curDate);
      const remaining = stock - d * days;
      let gap = null;
      if (remaining < -1e-6) {
        gap = { from: addDays(curDate, stock / d), to: b.etaDate, missQty: Math.ceil(-remaining) };
      }
      const tight = remaining >= -1e-6 && remaining < d;
      const newStock = Math.max(remaining, 0) + b.qty;
      rows.push({ kind: "batch", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate, useBy: addDays(b.etaDate, newStock / d), gap, tight, stock: Math.round(newStock) });
      stock = newStock;
      curDate = b.etaDate;
    }

    // 末尾库存耗尽：最后一条记录之后无任何到货，自耗尽日起视为开放式断货（无截止日）
    const endGap = { from: addDays(curDate, stock / d), to: null, missQty: 0, terminal: true };
    rows[rows.length - 1].endGap = endGap;

    let firstGap = null;
    for (const r of rows) if (r.gap) { firstGap = r.gap; break; }
    if (!firstGap) firstGap = endGap;

    let status = "充足", statusNote = "30 天内无断货";
    if (firstGap) {
      const dt = dayDiff(firstGap.from, today);
      if (dt <= 10) { status = "紧急"; statusNote = "距缺货 " + dt + " 天"; }
      else if (dt <= 30) { status = "注意"; statusNote = "距缺货 " + dt + " 天"; }
      else { status = "充足"; statusNote = "缺货在 " + dt + " 天后（>30 天）"; }
    }
    const trend = Math.abs(sku.changeRate) > 10 ? "日均变化率 " + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%，" + (sku.changeRate > 0 ? "涨速需警惕" : "跌速需关注") : "";

    // 提货提醒：可售天数低于补货周期 → 现有库存撑不到下一批，须立即提货/补货
    const sellDays = sku.available / d;
    const pickupAlert = sellDays < params.cycle
      ? "⚠️ 可售 " + (Math.round(sellDays * 10) / 10) + " 天 < 补货周期 " + params.cycle + " 天，需立即提货"
      : "";

    return { sku, today, d, rows, overdue, overdueQty, anomaly, firstGap, status, statusNote, trend, sellDays, pickupAlert, finalStock: stock, finalDate: curDate };
  }

  // 方案一主力恒为海运（与是否填写海运无关，未填则取默认 SEA_DEFAULT 天）
  function seaMethod(p) { return { m: "海运", d: +p.sea > 0 ? +p.sea : SEA_DEFAULT }; }
  function options(p) { return [{ m: "海运", d: +p.sea }, { m: "陆运", d: +p.land }, { m: "空运", d: +p.air }].filter(x => x.d > 0); }
  // 方案二快补：从已启用方式中取最快；全部为 0 时回退海运
  function fastest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d < b.d ? a : b) : seaMethod(p); }
  // 方案二主力：只从已启用方式（d>0）中取最慢，0=不用该方式；全部为 0 时回退海运
  function enabledSlowest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d > b.d ? a : b) : seaMethod(p); }
  // 单批标准量：覆盖一个补货周期 + 安全库存。稳态滚动下恒定成立，与运输时长无关：
  // 下一批采购日 = 本批用完日 − safety − (提前期+运输天数) = 今天 + 补货周期（因本批到货日 = 今天+提前期+运输天数）
  // 即管道由「提前下单」填充，而非靠加大首批量 → 每批只需 d × (补货周期+安全库存)
  // 至少 1 天量，防止「补货周期 0 + 安全库存 0」算出 0 件导致后续推演失效
  function batchQty(d, params) { return Math.ceil(d * Math.max(1, params.cycle + params.safety)); }
  // 快补桥接量：空运/陆运等快通道每批只采够「提前期 + 安全库存 + 本通道运输天数」，
  // 仅覆盖「下单→到货」窗口 + 安全缓冲，够衔接即可、不囤货。主力慢通道（海运）仍用 batchQty（完整周期量）。
  // 例：d=26.57、提前期2、安全2、空运7 → ⌈26.57×11⌉ = 293（而非填满整段缺口的 638）
  function bridgeQty(d, params, method) { return Math.ceil(d * (params.leadTime + params.safety + method.d)); }
  // 衔接批次：期望「上批用完日 − 安全库存」到货；采购日早于今天则钳到今天并顺延到货，标记是否赶不上
  function chainBatch(prevUseBy, transit, today, params, qty, d) {
    let arrive = addDays(prevUseBy, -params.safety);
    let purchase = addDays(arrive, -transit);
    let lateDays = 0;
    if (purchase < today) { purchase = today; arrive = addDays(today, transit); lateDays = Math.max(dayDiff(arrive, prevUseBy), 0); }
    return { purchase, arrive, useBy: addDays(arrive, (params.safety * d + qty) / d), lateDays };
  }
  // 阶梯接力（快补能赶上断点 或 赶不上 都走这里）：
  //   今天同时下「最快方式（快补）」与「主力慢方式」两单 → 快补按<b>桥接量</b>滚动续接，直到慢方式首批能接上
  //   → 之后转慢方式滚动担主力。快补每批仅覆盖「提前期+安全+运输」天，够衔接即可，不囤货。
  function ladderLines(res, params, fast, slow) {
    const d = res.d, stdQty = batchQty(d, params);            // 主力（慢）批次：完整周期量
    const bridge = bridgeQty(d, params, fast);                // 快补批次：桥接量（仅覆盖提前期+安全+运输）
    const fastTransit = params.leadTime + fast.d, slowTransit = params.leadTime + slow.d;
    const slowArrive1 = addDays(res.today, slowTransit);      // 海运首批到货日
    const lines = [];

    // 快补第 1 单：今天下单，最早到货。到货时若仍在断货期内则库存为 0（不能按 safety 天乐观估算，否则会少排一单）
    const fastArrive1 = addDays(res.today, fastTransit);
    const carry1 = fastArrive1 > res.firstGap.from ? 0 : params.safety * d;
    let fU = addDays(fastArrive1, (carry1 + bridge) / d);
    lines.push({ purchase: res.today, method: fast.m, qty: bridge, arrive: fastArrive1, useBy: fU });

    // 快补滚动续接：每批桥接量，只补到「海运首批到货日」为止 —— 海运一到立刻交接、不再续接空运
    let guard = 0;
    while (dayDiff(slowArrive1, fU) > 0 && guard++ < 8) {
      const c = chainBatch(fU, fastTransit, res.today, params, bridge, d);
      lines.push({ purchase: c.purchase, method: fast.m, qty: bridge, arrive: c.arrive, useBy: c.useBy });
      if (dayDiff(c.useBy, fU) <= 0) break;   // 无法推进则停止，防死循环
      fU = c.useBy;
    }
    // 最后一批快补动态缩减：只撑到「海运首批到货日 + 安全库存」为止，不按固定桥接量过量采购
    const lastAir = lines.filter(l => l.method === fast.m).pop();
    if (lastAir) {
      const targetUB = addDays(slowArrive1, params.safety);   // 海运到货 + 安全缓冲 = 交接目标日
      if (dayDiff(lastAir.useBy, targetUB) > 0) {             // 末批用完日晚于交接目标 → 缩减
        const gapDays = Math.max(0, dayDiff(targetUB, lastAir.arrive));  // 末批实际需要覆盖的天数
        if (gapDays >= 1) {
          lastAir.qty = Math.ceil(d * gapDays);               // 按需缩减，够撑到交接目标即可
          lastAir.useBy = targetUB;
        }
      }
    }
    // 快补已覆盖到海运到货日（不再依赖快补）→ 标记衔接成功
    const linked = dayDiff(fU, slowArrive1) >= 0;

    // 海运首填量：若远超正常单批(>2×)，拆成多个周期间隔的小批，避免单批过大、且第2批尽快(按周期)补
    //   正常单批基准 stdQty = ⌈d×(周期+安全)⌉；首填总量 seaRampQty = ⌈d×(周期+海运)⌉（覆盖到海运正常滚动接手）
    const seaRampQty = Math.ceil(d * (params.cycle + slow.d));
    const SPLIT_K = Math.min(8, Math.max(1, Math.ceil(seaRampQty / stdQty)));
    const MIN_BATCH = Math.ceil(stdQty * 0.2);                  // 末批余数 < 20% 单批视为无意义微单
    const remain = seaRampQty - stdQty * (SPLIT_K - 1);         // 末批余数
    lines.seaRampQty = seaRampQty;
    if (seaRampQty > 2 * stdQty && SPLIT_K > 1) {
      const dropRemain = remain < MIN_BATCH;                   // 余数过小 → 直接丢弃，不单独下单（按用户要求）
      const realK = dropRemain ? SPLIT_K - 1 : SPLIT_K;
      lines.splitK = realK;
      lines.splitDropped = dropRemain ? remain : 0;
      // 拆分：从今天起每 cycle 天发一批（每批=stdQty，余数过小则丢弃），累计覆盖首填总量；之后按重订货点继续滚动
      let pd = res.today;
      for (let i = 0; i < realK; i++) {
        const q = stdQty;                                      // 余数已丢弃，每批均为标准量
        const arr = addDays(pd, slowTransit);
        const ub = addDays(arr, (params.safety * d + q) / d);
        lines.push({ purchase: pd, method: slow.m, qty: q, arrive: arr, useBy: ub });
        pd = addDays(pd, params.cycle);                        // 每周期一批
      }
      // 拆分末批之后，按正常重订货点继续滚动 2 批，展示稳态管道
      let last = lines[lines.length - 1];
      for (let i = 0; i < 2; i++) {
        const c = chainBatch(last.useBy, slowTransit, res.today, params, stdQty, d);
        lines.push({ purchase: c.purchase, method: slow.m, qty: stdQty, arrive: c.arrive, useBy: c.useBy });
        last = c;
      }
    } else {
      lines.splitK = 1;
      // 首填量不大：保持单批首填 + 按重订货点下第2/3批（原逻辑）
      const sea1UseBy = addDays(slowArrive1, (params.safety * d + seaRampQty) / d);
      lines.push({ purchase: res.today, method: slow.m, qty: seaRampQty, arrive: slowArrive1, useBy: sea1UseBy });
      let sea2Purchase = addDays(slowArrive1, (params.cycle + slow.d) - (params.leadTime + slow.d + params.safety));
      if (dayDiff(sea2Purchase, res.today) < 0) sea2Purchase = res.today;
      const sea2Arrive = addDays(sea2Purchase, slowTransit);
      const sea2UseBy = addDays(sea2Arrive, (params.safety * d + stdQty) / d);
      lines.push({ purchase: sea2Purchase, method: slow.m, qty: stdQty, arrive: sea2Arrive, useBy: sea2UseBy });
      const c3 = chainBatch(sea2UseBy, slowTransit, res.today, params, stdQty, d);
      lines.push({ purchase: c3.purchase, method: slow.m, qty: stdQty, arrive: c3.arrive, useBy: c3.useBy });
    }

    lines.linked = linked;
    return lines;
  }

  // 重订货点：沿时间轴找「现有+到货库存」可覆盖天数首次降到 (提前期+安全+运输) 的日期，作为首批采购日
  // 不提前占款；若今天已≤阈值则今天采
  function computeReorderDate(res, params, slow) {
    const d = res.d;
    const reorderQty = d * (params.leadTime + params.safety + slow.d);
    const arriveQty = {};
    for (const r of res.rows) {
      if (r.kind === "current") continue;
      const t = +r.arrive;
      arriveQty[t] = (arriveQty[t] || 0) + r.qty;
    }
    const events = Object.keys(arriveQty).map(Number).sort((a, b) => a - b);
    let stock = res.sku.available, cur = res.today;
    if (stock <= reorderQty) return res.today;
    for (const ev of events) {
      const segDays = dayDiff(ev, cur);
      const atStart = stock - d * segDays;
      if (atStart <= reorderQty) return addDays(cur, Math.ceil((stock - reorderQty) / d));
      stock = atStart + arriveQty[ev];
      cur = new Date(ev);
    }
    return addDays(cur, Math.ceil((stock - reorderQty) / d));
  }

  // mainMethod 默认海运（方案一恒为海运基准）；方案二传入 enabledSlowest，避免输出未启用的方式
  function planA(res, params, mainMethod, firstPurchase) {
    const d = res.d, slow = mainMethod || seaMethod(params);
    // 滚动补货口径：每批等量 = 补货周期 + 安全库存；不预扣现有库存（由时间轴自然消耗）
    const q1 = batchQty(d, params);
    const q2 = q1, q3 = q1;
    const transit = params.leadTime + slow.d;

    // 批次衔接留安全库存：下一批在"上批用完日 − 安全库存天数"到货，到货时仍剩安全库存量
    const p1 = firstPurchase || res.today, a1 = addDays(p1, transit);
    // 首批到货时的剩余库存：复用时间轴，累加在途到 a1 的到货量后消耗到 a1
    let stockAtA1 = res.sku.available + res.overdueQty, cursor = res.today;
    for (const r of res.rows) {
      if (r.kind !== "batch") continue;
      if (r.arrive > a1) break;
      stockAtA1 = Math.max(stockAtA1 - d * dayDiff(r.arrive, cursor), 0) + r.qty;
      cursor = r.arrive;
    }
    stockAtA1 = Math.max(stockAtA1 - d * dayDiff(a1, cursor), 0);
    const u1 = addDays(a1, (stockAtA1 + q1) / d);
    const c2 = chainBatch(u1, transit, res.today, params, q2, d);
    const c3 = chainBatch(c2.useBy, transit, res.today, params, q3, d);

    // 首批最迟采购日：保证首批在库存耗尽前到货
    const exhaust = res.firstGap ? res.firstGap.from : res.rows[res.rows.length - 1].useBy;
    const latestP1 = addDays(exhaust, -transit);

    // 缓冲天数 = 断点 − 首批到货日：负数=到货前已断货，0=贴线，正数=安全
    const buf = dayDiff(res.firstGap.from, a1);
    let risk;
    if (buf < 0) risk = "首批 " + fmtMD(a1) + " 到货前即断货（断点 " + fmtMD(res.firstGap.from) + "），纯" + slow.m + "不可行，需提前采购或加快";
    else if (buf < 1) risk = "首批贴线到货，决策窗口短";
    else risk = "首批到货前不断货（缓冲 " + buf + " 天）";
    const lateParts = [];
    if (c2.lateDays > 0) lateParts.push("第2批断货 " + c2.lateDays + " 天");
    if (c3.lateDays > 0) lateParts.push("第3批断货 " + c3.lateDays + " 天");
    if (lateParts.length) risk += "；" + lateParts.join("，") + "，需加大批量或改用更快渠道";
    const latest = latestP1 < res.today ? "最迟采购节点已过，须立即下单" : "首批最迟采购日 " + fmtMD(latestP1);

    const seaNote = +params.sea > 0 ? "" : "海运未填写（0），按默认 " + SEA_DEFAULT + " 天估算；";
    return { title: "方案一（纯海运·分批）", note: seaNote + "全程只用" + slow.m + "分批补货，每批 " + q1 + " 件（补货周期+安全库存），每 " + params.cycle + " 天滚动一单；" + latest, risk,
      lines: [{ purchase: p1, method: slow.m, qty: q1, arrive: a1, useBy: u1 },
        { purchase: c2.purchase, method: slow.m, qty: q2, arrive: c2.arrive, useBy: c2.useBy },
        { purchase: c3.purchase, method: slow.m, qty: q3, arrive: c3.arrive, useBy: c3.useBy }] };
  }

  // 方案三（组合·推荐）：快+慢接力，防断货且资金均衡。
  // 若所选物流使组合退化为单一渠道，则与方案一/方案二等价，仅作引用、不重复展开。
  function planB(res, params) {
    const d = res.d, slow = enabledSlowest(params), fast = fastest(params);
    const noMethod = options(params).length === 0
      ? "未填写任何运输方式，按海运 " + SEA_DEFAULT + " 天默认估算；" : "";
    const title = "方案三（组合·推荐）";

    // —— 单一渠道退化：与方案一/方案二等价，直接引用、不展开明细 ——
    if (slow.m === fast.m) {
      if (slow.m === "海运") return { title, collapsedTo: "plan1", note: "同方案一（纯海运·分批）", lines: [] };
      if (slow.m === "空运") return { title, collapsedTo: "plan2", note: "同方案二（纯空运·分批）", lines: [] };
      const a = planA(res, params, slow, res.today);
      return { title, note: noMethod + "仅" + slow.m + "一种方式可用，等价于纯" + slow.m + "分批", risk: a.risk, lines: a.lines };
    }

    const slowTransit = params.leadTime + slow.d;
    const slowArrive = addDays(res.today, slowTransit);
    // 在途能否撑到主力方式首批到货，且到货时仍留有安全库存（贴线不算充足）
    const canSustain = !res.firstGap || res.firstGap.from >= addDays(slowArrive, params.safety);

    // 重订货点：首批延后到「现有+到货库存可覆盖天数降至(提前期+安全+运输)」时再采，不提前占款
    const exhaust = res.firstGap ? res.firstGap.from : res.rows[res.rows.length - 1].useBy;
    const latestP1 = addDays(exhaust, -slowTransit);
    let firstPurchase = computeReorderDate(res, params, slow);
    let deferredNote = "";
    if (firstPurchase > latestP1) { firstPurchase = latestP1; deferredNote = "（重订货点晚于最迟采购日，已提前至 " + fmtMD(firstPurchase) + " 以确保不断货）"; }
    else if (firstPurchase > res.today) deferredNote = "（首批延后至 " + fmtMD(firstPurchase) + " 采购·重订货点）";
    if (firstPurchase < res.today) firstPurchase = res.today;

    if (canSustain) {
      const a = planA(res, params, slow, firstPurchase);
      return { title, note: noMethod + "在途充足，直接" + slow.m + "分批" + deferredNote, risk: a.risk, lines: a.lines };
    }
    // ②/③ 快补能赶上断点（fastArrive ≤ 断点）或 ④ 赶不上（fastArrive > 断点）
    // 统一走「快补阶梯接力」：每个快补批次仅采够「提前期+安全库存+运输天数」的桥接量，
    // 滚动续接直至主力首批到货接手，再转主力滚动担主力。海陆空混合时快补不会一次性采购过量。
    const gapFrom = res.firstGap.from;
    const fastArrive = addDays(res.today, params.leadTime + fast.d);
    const catchUp = fastArrive <= gapFrom;
    const bridge = bridgeQty(d, params, fast);
    const lines = ladderLines(res, params, fast, slow);
    const nFast = lines.filter(l => l.method === fast.m).length;
    const unlinked = lines.linked === false
      ? "；⚠️ 快补批次数已达上限（8 批）仍未接上" + slow.m + "，方案可能残留断档，建议加大单批量或启用" + (params.land > 0 && slow.m !== "陆运" ? "陆运等" : "") + "中间渠道" : "";
    // 快补只补到海运到货日（末批动态缩减至「海运到货+安全」）；海运首填量拆成周期间隔小批，到货后转海运滚动担主力
    const seaPart = lines.splitK > 1
      ? (slow.m + "首填量 " + lines.seaRampQty + " 件拆分为每 " + params.cycle + " 天一批（共 " + lines.splitK + " 批）"
         + (lines.splitDropped ? "、末批微量余数 " + lines.splitDropped + " 件过小已丢弃" : "") + "、到货即滚动担主力")
      : (slow.m + "首批 " + lines.seaRampQty + " 件（首填量·够覆盖到" + slow.m + "第2批到货）");
    const lastAir = lines.filter(l => l.method === fast.m).pop();
    const tailNote = (lastAir && lastAir.qty < bridge) ? "，末批按需缩至 " + lastAir.qty + " 件（仅撑到" + slow.m + "到货+安全库存）" : "";
    const rampNote = fast.m + "每批 " + bridge + " 件（桥接量·仅覆盖提前期+安全+运输）补到" + slow.m + "首批到货日为止共 " + nFast + " 批（约 " + (nFast * bridge) + " 件" + tailNote + "）；" + seaPart + "，不再空运";

    if (catchUp) {
      return { title,
        note: noMethod + fast.m + "今天下单可赶上断点，" + rampNote,
        risk: "",
        lines };
    }
    const stockoutQty = Math.ceil(d * dayDiff(fastArrive, gapFrom));
    return { title,
      note: "断点太近，" + fast.m + "今天下单也赶不上：今日同时下「" + fast.m + "」与「" + slow.m + "」两单，" + rampNote,
      risk: "预计断货 " + fmtMD(gapFrom) + "→" + fmtMD(fastArrive) + "，缺货约 " + stockoutQty + " 件；建议立即催提在途或加价更快渠道" + unlinked,
      lines };
  }

  // 方案二（纯空运·分批）：与方案一对称，仅强制空运，不管其他渠道是否填写。
  // 空运未填(0)时回退默认 7 天；首批延后到重订货点（充裕时延后、紧急/缺口则今天）。
  function planAir(res, params) {
    const d = res.d;
    const filled = +params.air > 0;
    const airDays = filled ? +params.air : 7;
    const airMethod = { m: "空运", d: airDays };
    const airTransit = params.leadTime + airDays;
    const exhaust = res.firstGap ? res.firstGap.from : res.rows[res.rows.length - 1].useBy;
    const latestP1 = addDays(exhaust, -airTransit);
    let firstPurchase = computeReorderDate(res, params, airMethod);
    if (firstPurchase > latestP1) firstPurchase = latestP1;
    if (firstPurchase < res.today) firstPurchase = res.today;
    const a = planA(res, params, airMethod, firstPurchase);
    const warn = filled ? "" : "（空运运输天数未填写，按默认 7 天估算）";
    const deferredNote = firstPurchase > res.today ? "（首批延后至 " + fmtMD(firstPurchase) + " 采购·重订货点）" : "";
    return { title: "方案二（纯空运·分批）",
      note: warn + "全程只用空运分批补货，每批 " + a.lines[0].qty + " 件（补货周期+安全库存），每 " + params.cycle + " 天滚动一单" + deferredNote,
      risk: a.risk, lines: a.lines };
  }

  /* ---------- Markdown ---------- */
  function toMarkdown(res, plans, params) {
    const d = res.d;
    let md = "===SKU:" + (res.sku.code || "未命名") + "===\n\n";
    md += "**库存状态**：" + res.status + "（" + res.statusNote + "）";
    if (res.trend) md += "；" + res.trend;
    md += "\n\n";
    md += "日均30天 " + res.sku.daily30 + " ｜ 日均7天 " + res.sku.daily7 + " ｜ 日均变化率 " + (res.sku.changeRate > 0 ? "+" : "") + res.sku.changeRate + "%\n\n";
    if (res.pickupAlert) {
      md += res.pickupAlert + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "\n\n";
    }
    md += "**库存时间轴**：\n";
    md += "| 采购 | 方式 | 数量 | 预计到货 | 预计用完 |\n|---|---|---|---|---|\n";
    md += "| — | — | 当前库存 " + res.rows[0].qty + " 件 | — | " + fmtMD(res.rows[0].useBy) + " |\n";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? fmtMD(parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = fmtMD(r.arrive) + " (逾期未提货)";
      else if (r.tight) arrive = fmtMD(r.arrive) + " ⚠️贴线";
      else arrive = fmtMD(r.arrive);
      const gap = r.gap ? " 🔴断货 " + fmtMD(r.gap.from) + "→" + fmtMD(r.gap.to) + " 缺 " + r.gap.missQty + " 件" : "";
      const endM = r.endGap ? " 🔴断货 " + fmtMD(r.endGap.from) + " 起（无后续到货）" : "";
      md += "| " + pd + " | " + r.method + " | " + r.qty + " | " + arrive + " | " + fmtMD(r.useBy) + gap + endM + " |\n";
    }
    if (res.anomaly.length) {
      md += "\n⚠️ 以下在途批次未纳入计算：\n";
      for (const a of res.anomaly) md += "  - " + (a.method || "未知方式") + " " + a.qty + " 件（" + a.reason + "）\n";
    }
    md += "\n**采购方案**：\n";
    for (const p of plans) {
      md += "\n- **" + p.title + "**：" + p.note + (p.risk ? "（" + p.risk + "）" : "") + "\n";
      for (const l of p.lines) md += "  - " + fmtMD(l.purchase) + "采购，" + l.method + l.qty + "件，预计到货" + fmtMD(l.arrive) + "，预计用完 " + fmtMD(l.useBy) + "\n";
    }
    return md;
  }

  return { parse, analyze, planA, planB, planAir, toMarkdown, fmt, fmtMD, parseDate };
})();

/* ============================================================
 * UI 层（仅测试用，接入网站时只保留上面模块即可）
 * ============================================================ */
function getParams() {
  return {
    cycle: +document.getElementById("p-cycle").value,
    leadTime: +document.getElementById("p-lead").value,
    safety: +document.getElementById("p-safety").value,
    sea: +document.getElementById("p-sea").value,
    land: +document.getElementById("p-land").value,
    air: +document.getElementById("p-air").value,
  };
}
function getBaseDate() {
  const v = document.getElementById("p-base").value;
  return v ? new Date(v) : new Date();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
/* 术语浮动注释：给 .tip 元素绑定 hover 浮层（支持多行 br，不裁剪、不随滚动偏移） */
function bindTips(rootEl) {
  if (!rootEl) return;
  rootEl.querySelectorAll(".tip").forEach(el => {
    el.addEventListener("mouseenter", function () {
      const box = document.createElement("div");
      box.className = "tipbox";
      box.innerHTML = el.getAttribute("data-tip") || "";
      document.body.appendChild(box);
      const r = el.getBoundingClientRect();
      const tw = box.offsetWidth;
      let left = r.left;
      if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
      box.style.left = left + "px";
      box.style.top = (r.bottom + 6) + "px";
      el._box = box;
    });
    el.addEventListener("mouseleave", function () { if (el._box) { el._box.remove(); el._box = null; } });
  });
}


/* 计算说明面板：参数定义 / 公式 / 方案逻辑，数值随填写值实时变化；术语带 hover 浮动注释 */
function renderCalcDoc() {
  const p = getParams();
  const base = document.getElementById("p-base").value || "今天";
  const V = s => '<span class="val">' + s + "</span>";
  const tbl = (head, rows) => '<table class="def"><tr>' + head.map(t => "<th>" + t + "</th>").join("")
    + "</tr>" + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</table>";
  const mth = (d, extra) => d > 0 ? V(d + " 天") : V("0") + "（未启用" + (extra || "") + "）";
  // 术语浮动注释：T(显示文本, 注释)；注释支持 <br> 换行，内部避免 ASCII 双引号
  const escAttr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const T = (txt, tip) => '<span class="tip" data-tip="' + escAttr(tip) + '">' + txt + "</span>";

  let h = "<h3>一、参数定义 <span style='color:var(--muted);font-weight:400;font-size:12px'>（鼠标移到带下划线的术语可查看浮动注释）</span></h3>";

    [T("安全库存 safety", "每批到货时希望手里仍保留的库存天数，用于吸收运输延误与销量波动"), V(p.safety + " 天"), "每批到货时应保留的缓冲库存天数"],

    [T("空运 air", "空运的运输时效（天）。填 0 时方案二按默认 7 天估算"), mth(p.air, "；方案二仍按默认 7 天估算"), "0 = 本次不用该方式"],

  h += '<div class="note">三种运输方式<b>默认 海运25天 / 陆运7天 / 空运5天</b>。填 0 = 该渠道本次不用（不参与' + T("方案三（组合）", "主力 = 已启用方式中最慢者、快补 = 最快者；全 0 时回退海运 25 天") + '）；但' + T("方案一恒按海运", "无论是否填写海运，方案一都只用海运，海运 0 则取默认 25 天（成本基准）") + '、' + T("方案二恒按空运", "方案二强制只用空运，空运 0 则取默认 7 天") + '作为基准（即使对应天数填 0）。</div>';

  h += "<h3>二、输入字段定义</h3>";
  h += tbl(["输入字段", "含义", "说明"], [
    [T("日均7天 d", "最近 7 天日销量均值，全表统一的消耗口径；缺失时用「销量7天 ÷ 7」推导"), "统一消耗口径", "所有「预计用完」「断货」计算都用它"],

  h += "<h3>三、基础计算公式</h3>";
  h += tbl(["计算项", "公式", "说明"], [
    ["可售天数", "可用库存 ÷ " + T("d", "日均7天") , "低于" + T("补货周期", "相邻两批采购间隔，见参数定义") + " → 红字「需立即提货」"],
    [T("单批采购量 batchQty", "慢通道（海运）每批标准量 = ⌈d × (cycle+safety)⌉；三批等量、与运输时长无关（管道靠提前下单填充）"), "⌈d × (补货周期 + 安全库存)⌉ = ⌈d × " + (p.cycle + p.safety) + "⌉", "三批等量；与运输时长无关"],

    ["到货日", "采购日 + leadTime + 运输天数", "—"],
    ["预计用完（批次行）", "到货日 + (max(到货时剩余,0) + 本批数量) ÷ d", "断货期库存为 0，缺货不计入消耗"],

    [T("缺货件数 missQty", "断货期间损失的销量 ⌈d × 断货天数⌉，属机会成本，不计入库存消耗、不从后续库存扣减"), "⌈d × 断货天数⌉", "断货期损失销量，不扣减库存"],
    [T("贴线", "到货时剩余库存不足 1 天用量，缓冲极薄，轻微延误即断货"), "到货时剩余 < 1 天用量", "红字「⚠️贴线」"],
    ["库存状态", "30 天无断货 = 充足；≤10 天 = 紧急；10–30 天 = 注意", "以时间轴推算为准"],
    [T("超期在途", "采购距今 > 90 天仍未提货的批次"), "采购 > 90 天未提货", "底部红字列出，忽略不计"],
    [T("异常批次", "无预计到货，或日期非 4 位年份"), "无预计到货 / 日期异常", "底部红字列出，不参与计算"],
  ]);

  h += "<h3>四、方案逻辑</h3>";
  h += "<table><tr><td style='width:26%;font-weight:600'>方案一（纯海运·分批）<br><span style='font-weight:400;color:var(--muted)'>成本基准</span></td><td>"
    + T("主力恒为海运", "无论参数是否填海运，方案一都只用海运；海运 0 则取默认 25 天（最经济渠道的成本参照）") + "（海运填 0 按默认 25 天估算），" + T("三批等量", "3 个批次采购量完全相同，均为 batchQty，不因批次序号加量") + "：每批 ⌈d × " + (p.cycle + p.safety) + "⌉，第 1 批基准日下单，之后每 "
    + p.cycle + " 天滚动一单。<br>紧急场景下首批到货常晚于断点，方案一会明确标注「不可行」——它是成本参照而非可执行方案。</td></tr>"
    + "<tr><td style='font-weight:600'>方案二（纯空运·分批）<br><span style='font-weight:400;color:var(--muted)'>应急/最快</span></td><td>"
    + "与方案一对称，仅强制" + T("空运", "方案二只用空运，空运 0 则取默认 7 天") + "（空运 0 按默认 7 天估算），不管海运/陆运是否填写。每批 ⌈d × " + (p.cycle + p.safety) + "⌉，首批延后到" + T("重订货点", "现有+在途库存可覆盖天数降至 (leadTime+safety+空运天数) 时再下单，不提前占款；紧急/缺口则今天") + "（充裕时延后、紧急/缺口则今天），之后每 " + p.cycle + " 天滚动一单。</td></tr>"
    + "<tr><td style='font-weight:600'>方案三（组合·推荐）<br><span style='font-weight:400;color:var(--muted)'>可执行</span></td><td>"
    + "主力 = " + T("已启用方式中最慢者", "在填了天数(d>0)的方式里取运输最久的；全 0 则回退海运 25 天") + "；快补 = " + T("已启用方式中最快者", "在填了天数的方式里取运输最快的；全 0 则回退海运 25 天") + "。<br>首批延后到" + T("重订货点", "现有+到货库存可覆盖天数降至 (leadTime+safety+运输天数) 时再采，不提前占款；已≤阈值或遇紧急缺口则今天") + "。四种情况见下方「五、方案三分情况说明」。</td></tr></table>";
  h += '<div class="note">批次衔接固定留安全库存（下一批到货日 = 上批用完日 − ' + p.safety + ' 天），因此单批量无需再叠加运输时长。</div>';
  h += '<div class="note">快通道（空运/陆运）采用' + T("桥接量", "每批仅覆盖 leadTime+safety+本通道运输天数，够衔接即可不囤货") + '；慢通道（海运）仍用完整周期批量 ⌈d × ' + (p.cycle + p.safety) + '⌉。</div>';

  h += "<h3>五、方案三（组合）分情况说明</h3>";
  h += tbl(["情况", "触发条件", "处理"], [
    [T("A. 无缺口", "在途库存足以撑到主力首批到货，且到货后仍留安全库存"), "在途能撑到「主力到货 + safety」", "直接按主力方式分批；首批可延后到重订货点，不提前占款"],
    [T("B. 单渠道退化", "只填了一种运输方式，组合退化为单一渠道"), "仅填海运 / 仅填空运 / 仅填陆运", T("与方案一/二等价，仅引用不展开", "仅海运 → 同方案一；仅空运 → 同方案二；仅陆运 → 展开纯陆运明细")],
    [T("C. 快补赶上", "有缺口但今天下单最快物流能在断点前到货"), "快补到货日 ≤ 断点", "快补按" + T("桥接量", "仅覆盖 leadTime+safety+快补运输天数") + "滚动补缺口；" + T("只补到主力首批到货日为止", "主力一到立刻交接，快补不再续接，避免空运过量") + "，之后主力滚动担主力"],
    [T("D. 快补赶不上（阶梯接力）", "有缺口且最快物流今天下单也晚于断点"), "快补到货日 > 断点", "今日同时下「快补」与「主力」两单；快补按桥接量补到主力到货日；" + T("末批动态缩减", "最后一批快补不按固定桥接量，而是缩至仅撑到「主力到货日+安全库存」，避免重叠过量") + "；主力" + T("首填量", "⌈d × (cycle+主力运输天数)⌉，覆盖到主力正常滚动接手") + "若 > 2× 单批量则" + T("拆分", "拆成每周期一批的小批，第2批仅隔 1 周期、末批余数 < 20% 单批则丢弃") + "；主力到货后转滚动担主力。同时给断货区间 + 缺货件数预警"],
  ]);

  h += "<h3>六、为什么三批等量？</h3>";
  h += "<table><tr><td>稳态滚动模型下，" + T("管道库存靠「提前下单」填充", "每批在上一拍用完前 safety 天就到货，故每批只需覆盖一个周期 + 安全") + "，而非靠加大首批量。证明：第 n 批采购日 = 基准日 + (n−1) × 周期，与运输时长无关。首批量加大并不能让首批更早到货，每批只需覆盖一个" + T("补货周期+安全库存", "cycle+safety 天") + "即可。</td></tr></table>";

  const body = document.getElementById("calc-doc-body");
  body.innerHTML = h;
  bindTips(body);
}

function run() {
  const out = document.getElementById("output");
  const params = getParams();
  const base = getBaseDate();
  const text = document.getElementById("input").value;
  renderCalcDoc();
  const skus = ReplenishModule.parse(text);
  if (!skus.length) { out.innerHTML = '<div class="err">未识别到 SKU 数据，请检查输入格式。</div>'; return; }

  const tally = { 紧急: 0, 注意: 0, 充足: 0 };
  let html = "";
  for (const sku of skus) {
    const res = ReplenishModule.analyze(sku, params, base);
    if (res.error) { html += '<div class="sku-card"><div class="err">' + esc(res.error) + "</div></div>"; continue; }
    const plans = [ReplenishModule.planA(res, params), ReplenishModule.planAir(res, params), ReplenishModule.planB(res, params)];
    const md = ReplenishModule.toMarkdown(res, plans, params);
    const badge = res.status === "充足" ? "green" : res.status === "注意" ? "orange" : "red";
    tally[res.status] = (tally[res.status] || 0) + 1;

    // 默认收起，点击标题展开/收起
    html += '<details class="sku-card">';
    html += '<summary><span class="sku-title">' + esc(sku.code || "未命名") + '</span><span class="badge ' + badge + '">' + res.status + "</span>";
    html += '<span class="sum-meta">' + esc(res.statusNote) + " ｜ 日均7天 " + sku.daily7 + " ｜ 可用 " + res.rows[0].qty + " 件" + (res.pickupAlert ? " ｜ 需提货" : "") + "</span>";
    html += '<button class="copy-btn" data-md="' + esc(md.replace(/\n/g, "\\n")) + '" onclick="event.stopPropagation();event.preventDefault();copyMd(this)">复制 Markdown</button></summary>';
    html += '<div class="sku-body">';
    html += '<div class="status-line">SKU: ' + esc(sku.code || "未命名") + " ｜ " + esc(res.statusNote) + (res.trend ? "；" + esc(res.trend) : "") + "</div>";
    html += '<div class="status-line">日均30天 ' + sku.daily30 + ' ｜ 日均7天 ' + sku.daily7 + ' ｜ 日均变化率 ' + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%</div>";

    if (res.pickupAlert) {
      html += '<div class="warn">' + esc(res.pickupAlert) + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "</div>";
    }

    html += "<table><tr><th>采购</th><th>方式</th><th>数量</th><th>预计到货</th><th>预计用完</th></tr>";
    html += "<tr><td>—</td><td>—</td><td>当前库存 " + res.rows[0].qty + " 件</td><td>—</td><td>" + ReplenishModule.fmtMD(res.rows[0].useBy) + "</td></tr>";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? ReplenishModule.fmtMD(ReplenishModule.parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = '<td>' + ReplenishModule.fmtMD(r.arrive) + ' <span style="color:var(--red)">(逾期未提货)</span></td>';
      else if (r.tight) arrive = '<td class="gap">' + ReplenishModule.fmtMD(r.arrive) + " ⚠️贴线</td>";
      else arrive = "<td>" + ReplenishModule.fmtMD(r.arrive) + "</td>";
      const useByStr = ReplenishModule.fmtMD(r.useBy);
      const gapMark = r.gap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(r.gap.from) + "→" + ReplenishModule.fmtMD(r.gap.to) + " 缺 " + r.gap.missQty + " 件</span>" : "";
      const endMark = r.endGap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(r.endGap.from) + " 起（无后续到货）</span>" : "";
      html += "<tr><td>" + pd + "</td><td>" + esc(r.method) + "</td><td>" + r.qty + "</td>" + arrive + "<td>" + useByStr + gapMark + endMark + "</td></tr>";
    }
    html += "</table>";
    if (res.anomaly.length) {
      html += '<div class="warn">⚠️ 以下 ' + res.anomaly.length + ' 批在途未纳入计算：</div><ul style="color:#d93025;font-size:13px;margin:2px 0 0 18px;padding:0">';
      for (const a of res.anomaly) html += "<li>" + esc(a.method || "未知方式") + " " + a.qty + " 件（" + esc(a.reason) + "）</li>";
      html += "</ul>";
    }

    for (const p of plans) {
      html += '<div class="plan"><h4>' + esc(p.title) + "</h4>";
      html += '<div class="note">' + esc(p.note) + "</div>";
      if (p.risk) html += '<div class="note risk">' + esc(p.risk) + "</div>";
      if (p.lines.length) {
        html += "<ol>";
        for (const l of p.lines) html += "<li>" + ReplenishModule.fmtMD(l.purchase) + "采购，" + esc(l.method) + l.qty + "件，预计到货" + ReplenishModule.fmtMD(l.arrive) + "，预计用完 " + ReplenishModule.fmtMD(l.useBy) + "</li>";
        html += "</ol>";
      }
      html += "</div>";
    }
    html += "</div></details>";
  }

  const bar = '<div class="tally-bar">共 ' + skus.length + " 个 SKU："
    + '<span class="badge red">紧急 ' + (tally.紧急 || 0) + "</span> "
    + '<span class="badge orange">注意 ' + (tally.注意 || 0) + "</span> "
    + '<span class="badge green">充足 ' + (tally.充足 || 0) + "</span>"
    + '<button class="copy-btn" onclick="toggleAll(true)">全部展开</button>'
    + '<button class="copy-btn" onclick="toggleAll(false)">全部收起</button></div>';
  out.innerHTML = bar + html;
}

function toggleAll(open) {
  document.querySelectorAll("#output details.sku-card").forEach(d => { d.open = open; });
}

function copyMd(btn) {
  const md = btn.getAttribute("data-md").replace(/\\n/g, "\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制 Markdown", 1500); });
  } else {
    const ta = document.createElement("textarea"); ta.value = md; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); btn.textContent = "已复制";
  }
}

function loadSample() {

  const off = n => { const x = new Date(t); x.setDate(x.getDate() + n); return f(x); };
  document.getElementById("input").value = [
    "===SKU:DEMO-SKU-A===",
    "SKU: DEMO-SKU-A",
    "销量30天: 767", "销量7天: 186", "日均30天: 25.57", "日均7天: 26.57", "日均变化率: +3.9%",
    "在仓库库存: 171", "待发货库存: 40", "可用库存: 131", "可售天数: 4",
    "在途库存: 84",
    "在途明细（按采购单/批次逐单列出，预计到货=采购时间+运输时效）：",
    "- 绿色通道: 在途 6 件（采购时间 " + off(-663) + "，运输时效 0 天）",
    "- 空运: 在途 78 件（采购时间 " + off(-4) + "，运输时效 7 天，预计到货≈" + off(3) + "）",
    "",
    "===SKU:DEMO-001===",
    "SKU: DEMO-001",
    "销量30天: 9000", "销量7天: 2100", "日均30天: 300", "日均7天: 300", "日均变化率: +8%",
    "在仓库库存: 600", "待发货库存: 0", "可用库存: 3000", "可售天数: 10",
    "在途库存: 2400",
    "在途明细（按采购单/批次逐单列出，预计到货=采购时间+运输时效）：",
    "- 陆运: 在途 900 件（采购时间 " + off(-5) + "，运输时效 8 天，预计到货≈" + off(3) + "）",
    "- 海运: 在途 1500 件（采购时间 " + off(-1) + "，运输时效 26 天，预计到货≈" + off(25) + "）",
  ].join("\n");
  run();
}
