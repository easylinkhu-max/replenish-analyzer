<script>
/* ============================================================
 * 核心模块 ReplenishModule（可整体复制到你的网站复用）
 * API:
 *   parse(text) -> [sku]                解析粘贴文本
 *   analyze(sku, params, baseDate, opts) -> res  核心计算（可直接传结构化数据对象，绕过 parse）
 *                                     opts.excludeOverdue = true → 方案三口径（逾期未提货不并入库存）
 *   planB(res, params, titleOverride) -> plan   方案一（组合·含逾期未提货）；
 *                                     传「不含逾期的 res + 标题」→ 方案三（组合·不含逾期）
 *                                     （仅空运退化分支：方案一折叠引用方案二；方案三口径不同，独立展开明细）
 *   planAir(res, params) -> plan        方案二（纯空运·含逾期）
 *   planA(res, params, chan, fp, title)  纯单渠道分批，供 planB 内部复用
 *   alignNoRows(res, resNo) -> Map      两口径时间轴行按稳定键对齐（toMarkdown 与 UI 共用）
 *   toMarkdown(res, plans, params, resNo) -> string  生成 Markdown（resNo = 不含逾期口径，供时间轴第 6 列）
 *   lineNote(l, d, params) -> string    单批说明文本（默认不渲染；结果区不逐行附说明，需要时可开启）
 *   realGaps(res, d, slowArrive1) -> gap[]  真实断货段（三条过滤，快补的输入）
 *   gapSummary(res, params) -> {n,days,qty,gaps}  累计缺口（主力首批到货前的 realGaps 之和）
 *   gapMark(gap, endGap) -> string      断货标注文本（区间 / 开放式），UI 与 Markdown 共用
 *   cycleQty / batchCap / slowArriveOf  周期批批量 / 单批上限 / 主力首批到货日
 *   （UI 层 run() 负责方案三两个边界规则：无逾期批次时折叠提示；断货更早时 note 顶部加对照行）
 * ============================================================ */
const ReplenishModule = (function () {

  const SEA_DEFAULT = 30;   // 三种运输方式全填 0（都没启用）时回退此默认值（页面默认与其一致）
  const AIR_DEFAULT = 5;    // 空运填 0（未启用）时方案二按此默认值估算（与页面默认一致）
  const STALE_DAYS = 90;    // 在途超 3 个月未提货 → 列出但忽略不计
  const MAX_FAST_ROUNDS = 8; // 快补排批迭代上限（C5）

  /* ---------- 日期工具 ---------- */
  function parseDate(s) {
    if (!s) return null;
    const m = String(s).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + Math.ceil(n)); return x; }
  function dayDiff(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }
  function fmt(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtMD(d) { return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const sum = (arr, k) => arr.reduce((s, b) => s + b[k], 0);

  /* ---------- 解析 ---------- */
  function parse(text) {
    const skus = [];
    const parts = String(text).split(/===SKU/i);
    for (let p of parts) {
      p = p.replace(/^[：:]\s*\S+\s*=*/, "").trim();
      if (!p) continue;
      const sku = parseOne(p);
      if (sku.code || sku.daily7) skus.push(sku);
    }
    return skus;
  }
  function parseOne(block) {
    const sku = { code: "", daily7: 0, daily30: 0, changeRate: 0, available: 0, sellDays: 0, sales7: 0, inTransit: [] };
    for (const raw of block.split("\n")) {
      const line = raw.trim();
      let m;
      if ((m = line.match(/^SKU\s*[：:]\s*(\S+)/))) sku.code = m[1];
      else if ((m = line.match(/日均7天\s*[：:]\s*([\d.]+)/))) sku.daily7 = parseFloat(m[1]);
      else if ((m = line.match(/日均30天\s*[：:]\s*([\d.]+)/))) sku.daily30 = parseFloat(m[1]);
      else if ((m = line.match(/日均变化率\s*[：:]\s*([+\-]?[\d.]+)/))) sku.changeRate = parseFloat(m[1]);
      else if ((m = line.match(/可用库存\s*[：:]\s*([\d.]+)/))) sku.available = parseFloat(m[1]);
      else if ((m = line.match(/可售天数\s*[：:]\s*([\d.]+)/))) sku.sellDays = parseFloat(m[1]);
      else if ((m = line.match(/销量7天\s*[：:]\s*([\d.]+)/))) sku.sales7 = parseFloat(m[1]);
      else if ((m = line.match(/^\s*[-*]\s*([^：:\s]+)\s*[：:]\s*在途\s*(\d+)\s*件/))) {
        const pd = line.match(/采购时间\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const eta = line.match(/预计到货\s*[≈=~]?\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const ts = line.match(/运输时效\s*(\d+)/);
        sku.inTransit.push({ method: m[1], qty: parseInt(m[2]), purchaseDate: pd ? pd[1] : "", eta: eta ? eta[1] : "", transitDays: ts ? parseInt(ts[1]) : 0 });
      }
    }
    if (!sku.daily7 && sku.sales7) sku.daily7 = sku.sales7 / 7;
    return sku;
  }

  /* ---------- 核心计算 ---------- */
  // opts.excludeOverdue：方案三口径 —— 逾期未提货批次视为「到不了」，完全不参与推演
  //   （不并入库存、不产生时间轴行）。其 rows = 含逾期口径 rows 去掉 overdue 行后的序列，
  //   故两口径可按「非 overdue 行」一一对应，时间轴得以并排给出两列「预计用完」。
  //   缺省 false 时行为与改造前逐字节一致。
  function analyze(sku, params, baseDate, opts) {
    const d = sku.daily7;
    if (!d || d <= 0) return { error: "SKU " + (sku.code || "") + " 日均7天缺失或为0，无法计算" };
    const today = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
    const excludeOverdue = !!(opts && opts.excludeOverdue);

    const overdue = [], upcoming = [], anomaly = [];
    for (const b of sku.inTransit) {
      // 采购超 3 个月仍未提货 → 列出但忽略不计（不进时间轴、不计入方案）
      const pdDate = parseDate(b.purchaseDate);
      const age = pdDate ? dayDiff(today, pdDate) : null;
      if (age !== null && age > STALE_DAYS) {
        anomaly.push(Object.assign({}, b, { stale: true, reason: "采购 " + fmt(pdDate) + "，已 " + age + " 天未提货（超 3 个月），忽略不计" }));
        continue;
      }
      const eta = parseDate(b.eta);
      if (!eta) { anomaly.push(Object.assign({}, b, { reason: b.eta ? "预计到货日期格式异常" : "无预计到货日期" })); continue; }
      if (eta <= today) {
        if (excludeOverdue) continue;   // 方案三口径：逾期未提货 → 当到不了，不入时间轴、不并入库存
        overdue.push(Object.assign({}, b, { etaDate: eta }));
      } else upcoming.push(Object.assign({}, b, { etaDate: eta }));
    }
    upcoming.sort((a, b) => a.etaDate - b.etaDate);
    overdue.sort((a, b) => (parseDate(a.purchaseDate) || today) - (parseDate(b.purchaseDate) || today));
    const overdueQty = sum(overdue, "qty");

    const rows = [];
    let stock = sku.available;
    const firstUseBy = addDays(today, stock / d);
    rows.push({ kind: "current", qty: Math.round(stock), arrive: today, useBy: firstUseBy });

    for (const b of overdue) {
      stock += b.qty;
      rows.push({ kind: "overdue", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate || today, useBy: addDays(today, stock / d) });
    }

    let curDate = today;
    for (const b of upcoming) {
      const days = dayDiff(b.etaDate, curDate);
      const remaining = stock - d * days;
      // 断货区间归属「耗尽批」：gap.from（耗尽日）恰等于上一行 useBy → 标注挂到上一行
      // （即 rows 末行，断货开始的那一天），让「🔴断货 MM-DD→…」紧随耗尽批的「预计用完」显示，
      // 而非挂在晚到的本批行后。gap 语义 = 「本行用完日 到 下一批到货日」之间的断货。
      let gap = null;
      // 口径 2：不足 1 天量忽略 + 当天能衔接上不算断货
      //   remaining < -d ⇔ 耗尽日比本批到货日晚 1 天以上（remaining/d = 晚到的天数）
      if (remaining < -d) {
        gap = { from: addDays(curDate, stock / d), to: b.etaDate, missQty: Math.ceil(-remaining) };
        const prev = rows[rows.length - 1];
        if (prev) prev.gap = gap;
      }
      const tight = remaining >= -1e-6 && remaining < d;
      const newStock = Math.max(remaining, 0) + b.qty;
      rows.push({ kind: "batch", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate, useBy: addDays(b.etaDate, newStock / d), tight, stock: Math.round(newStock) });
      stock = newStock;
      curDate = b.etaDate;
    }

    // 末尾库存耗尽：最后一条记录之后无任何到货，自耗尽日起视为开放式断货（无截止日）
    const endGap = { from: addDays(curDate, stock / d), to: null, missQty: 0, terminal: true };
    rows[rows.length - 1].endGap = endGap;

    let firstGap = null;
    for (const r of rows) if (r.gap) { firstGap = r.gap; break; }
    if (!firstGap) firstGap = endGap;
    // 全部断货段（按时间序），供 realGaps 过滤；endGap 收尾
    const gaps = rows.filter(r => r.gap).map(r => r.gap);
    gaps.push(endGap);

    let status = "充足", statusNote = "30 天内无断货";
    if (firstGap) {
      const dt = dayDiff(firstGap.from, today);
      if (dt <= 10) { status = "紧急"; statusNote = "距缺货 " + dt + " 天"; }
      else if (dt <= 30) { status = "注意"; statusNote = "距缺货 " + dt + " 天"; }
      else { status = "充足"; statusNote = "缺货在 " + dt + " 天后（>30 天）"; }
    }
    const trend = Math.abs(sku.changeRate) > 10 ? "日均变化率 " + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%，" + (sku.changeRate > 0 ? "涨速需警惕" : "跌速需关注") : "";

    // 提货提醒：可售天数低于补货周期 → 现有库存撑不到下一批，须立即提货/补货
    const sellDays = sku.available / d;
    const pickupAlert = sellDays < params.cycle
      ? "⚠️ 可售 " + (Math.round(sellDays * 10) / 10) + " 天 < 补货周期 " + params.cycle + " 天，需立即提货"
      : "";

    return { sku, today, d, rows, overdue, overdueQty, anomaly, firstGap, gaps, excludeOverdue, status, statusNote, trend, sellDays, pickupAlert, finalStock: stock, finalDate: curDate };
  }

  // 时间轴推演：date 时刻的预计剩余库存 = 现有 + 逾期在途 + date 前到货的批次 − 期间消耗（不封底取 0）
  // planA 首批剩余库存、快补首单 carry 都用它，确保方案考虑现有/在途库存
  function projectedStock(res, d, date) {
    let stock = res.sku.available + res.overdueQty, cursor = res.today;
    for (const r of res.rows) {
      if (r.kind !== "batch") continue;
      if (r.arrive > date) break;
      stock = Math.max(stock - d * dayDiff(r.arrive, cursor), 0) + r.qty;
      cursor = r.arrive;
    }
    return Math.max(stock - d * dayDiff(date, cursor), 0);
  }

  // 海运兜底（未填写海运时取默认 SEA_DEFAULT 天；现在只在"完全没填任何方式"时用到）
  function seaMethod(p) { return { m: "海运", d: +p.sea > 0 ? +p.sea : SEA_DEFAULT }; }
  function options(p) { return [{ m: "海运", d: +p.sea }, { m: "陆运", d: +p.land }, { m: "空运", d: +p.air }].filter(x => x.d > 0); }
  // 最快方式：从已启用方式中取最快；全部为 0 时回退海运
  function fastest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d < b.d ? a : b) : seaMethod(p); }
  // 主力（慢方式）：只从已启用方式（d>0）中取最慢，0=不用该方式；全部为 0 时回退海运
  function enabledSlowest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d > b.d ? a : b) : seaMethod(p); }
  // 快补候选（口径 6）：页面已启用(d>0)且非主力，按运输天数 慢→快 —— 慢的优先（省运费）
  //   「先陆运后空运」不是写死的，只是「慢→快」在三种都填时的自然顺序；没填的方式不参与
  function fastCands(p, slowM) { return options(p).filter(x => x.m !== slowM).sort((a, b) => b.d - a.d); }
  // 单批上限（C4/C18）：⌈d×(补货周期+安全库存)⌉。只作 min() 上界，不产生实际量。
  //   F3 清理：与「周期批（非空运）」同式 → 抽公共函数，cycleQty 复用（表达式只在一处定义）
  function batchCap(d, params) { return Math.ceil(d * Math.max(1, params.cycle + params.safety)); }

  /* ---------- 快补：逐缺口 · 方式优先 · 逐亏空点 · 终点 ---------- */

  // 真实断货段 realGaps（§2.2）：汇总全部断货段（行间 + 开放式），三条过滤
  //   ① missQty ≥ d           —— 不足 1 天量忽略（口径 2）
  //   ② 结束日 > 开始日        —— 当天能衔接上不算断货（口径 2）
  //   ③ from < 主力首批到货日  —— 主力接得住的断货不算缺口（C7）
  //   第 ③ 条很关键：不加的话 SBEI-XL（开放断货晚于主力到货）会被误判成有缺口、白补一批
  function realGaps(res, d, slowArrive1) {
    const out = [];
    const keep = g => {
      if (!(g.missQty >= d)) return;
      if (g.to && dayDiff(g.to, g.from) <= 0) return;
      if (dayDiff(g.from, slowArrive1) >= 0) return;
      out.push(g);
    };
    for (const r of res.rows) if (r.gap) keep(r.gap);
    const last = res.rows[res.rows.length - 1];
    if (last && last.endGap) {           // 开放式断货：只取到主力到货日之前那一段
      const days = dayDiff(slowArrive1, last.endGap.from);
      if (days > 0) keep({ from: last.endGap.from, to: slowArrive1, missQty: Math.ceil(d * days), terminal: true });
    }
    return out;
  }

  // 主力首批到货日（= 今天 + 提前期 + 主力运输）：realGaps 第 ③ 条过滤、快补终点规则、
  //   累计缺口汇总三处共用同一参照日，集中一处避免各算一遍口径漂移
  function slowArriveOf(res, params) {
    return addDays(res.today, params.leadTime + enabledSlowest(params).d);
  }
  // 累计缺口汇总（§4 #15）：主力首批到货前所有真实缺口段（realGaps）的段数 / 天数 / 件数。
  //   UI 时间轴汇总行与 toMarkdown 共用，避免两处各写一遍过滤条件与口径
  function gapSummary(res, params) {
    const gaps = realGaps(res, res.d, slowArriveOf(res, params));
    return {
      n: gaps.length,
      days: gaps.reduce((s, g) => s + dayDiff(g.to, g.from), 0),
      qty: gaps.reduce((s, g) => s + g.missQty, 0),
      gaps,
    };
  }
  // 断货标注（公共 · §4 #15）：区间「🔴断货 MM-DD→MM-DD 缺 N 件」/ 开放式「🔴断货 MM-DD 起（无后续到货）」。
  //   网页时间轴两列与 Markdown 4 处曾各写一遍，统一由本函数产出（紧凑标记仅 Markdown「不含逾期」列保留）
  function gapMark(gap, endGap) {
    const seg = [];
    if (gap) {
      seg.push(gap.to
        ? "🔴断货 " + fmtMD(gap.from) + "→" + fmtMD(gap.to) + " 缺 " + gap.missQty + " 件"
        : "🔴断货 " + fmtMD(gap.from) + " 起（无后续到货）");
    }
    if (endGap) seg.push("🔴断货 " + fmtMD(endGap.from) + " 起（无后续到货）");
    return seg.join(" ");
  }

  // 逐缺口试探方式（口径 1 + C15 方式优先）：
  //   按缺口日升序，对每个缺口 慢→快 逐个方式，每个方式先试档 1、再试档 2；第一个满足者即选中。
  //   这样慢方式（便宜）不会被快方式的档 1 抢走 —— 「只有最紧急才空运」。
  //   档 1：缺口日 − 今天 ≥ 提前期 + 运输  → 采购日 = 缺口日 − 提前期 − 运输，到货日 = 缺口日（贴缺口，零缓冲 · C11/C14）
  //   档 2：缺口日 − 今天 ≥ 运输           → 采购日 = 今天，到货日 = 今天 + 运输（跳过提前期，标「⚠️ 需紧急采购」）
  //   所有缺口都来不及时 → null（口径 2.3：这次缺货就不管、往后看；全不行则 C6 不排快补）
  // 锚点 = 该缺口自己的 from（固定日期，天然是共用尺子）→ 原「取最快候选锚点」的技巧整段删除。
  function pickByGap(res, params, slowM, gaps) {
    const cands = fastCands(params, slowM);
    if (!cands.length) return null;
    for (const G of gaps) {
      const runway = dayDiff(G.from, res.today);
      for (let k = 0; k < cands.length; k++) {
        const c = cands[k];
        if (runway >= params.leadTime + c.d) return { method: c, k, gap: G, tier: 1, cands };
        if (runway >= c.d) return { method: c, k, gap: G, tier: 2, cands };
      }
    }
    return null;
  }
  // 本批终点 end（C16）——「空运只补一点点」：本批只负责「更慢的方式到不了的那一段」。
  //   本批不是最慢候选（k>0）→ end = 今天 + 更慢候选运输（更慢方式今天下单能到的日子）
  //   本批已是最慢候选（k=0）→ end = 主力首批到货日
  function fastEnd(res, params, pick, slowArrive1) {
    return pick.k > 0 ? addDays(res.today, pick.cands[pick.k - 1].d) : slowArrive1;
  }
  // 逐亏空点定量 fastNeed（C2 · 核心修复）：从到货日 A 起沿供给点推演，返回第一个亏空点的缺口量。
  //   供给点序列 = A 之后、end 之前的原有在途到货日（升序） + 终点 end
  //   零缓冲（C1）：不额外加 safety，缺多少补多少；到达终点即停（C16，不再一路补到主力到货日）
  //   为什么不用「target = 下一个在途到货日」：会被「只到 5 件」的小批次卡住算出 0，留下后续断货
  function fastNeed(res, d, A, end) {
    const pts = [];
    for (const r of res.rows) if (r.kind === "batch" && r.arrive > A && r.arrive < end) pts.push({ t: r.arrive, qty: r.qty });
    pts.sort((a, b) => a.t - b.t);
    pts.push({ t: end, qty: 0, terminal: true });
    let s = projectedStock(res, d, A), cur = A;
    for (const p of pts) {
      s -= d * dayDiff(p.t, cur);
      if (s < 0) return Math.ceil(-s);       // 第一个亏空点 → 本轮就补这么多
      if (p.terminal) break;                 // 到达终点 → 推演结束
      s += p.qty; cur = p.t;
    }
    return 0;
  }

  // 已排快补批并入在途，重新推演（C12 逐轮重算）：
  //   空运只在最紧急那轮被选中（陆运来不及），补上后库存恢复 → 后续轮次自动降级陆运（省运费）
  function withExtra(res, params, extra) {
    const sku = Object.assign({}, res.sku, {
      inTransit: res.sku.inTransit.concat(extra.map(l => ({
        method: l.method, qty: l.qty, purchaseDate: fmt(l.purchase), eta: fmt(l.arrive),
      }))),
    });
    return analyze(sku, params, res.today, res.excludeOverdue ? { excludeOverdue: true } : undefined);
  }

  // 快补排批（C2 逐亏空点 + C12 逐轮重选 + C16 终点，上限 8 轮 · C5）：
  //   每轮：重新推演 realGaps → 方式优先试探（慢→快） → 档1/档2 定采购与到货日 → 终点 → fastNeed 定量
  //         → 取单批上限 → 并入在途回到循环开头
  //   返回 { lines, exhausted }：exhausted = 所有缺口都来不及补（C6）
  function fastLines(res0, params, slow, slowArrive1) {
    const d = res0.d, lines = [];
    let res = res0, exhausted = false;
    for (let round = 0; round < MAX_FAST_ROUNDS; round++) {
      const gaps = realGaps(res, d, slowArrive1);
      if (!gaps.length) break;                                  // 已无缺口
      const pick = pickByGap(res, params, slow.m, gaps);
      if (!pick) { exhausted = true; break; }                   // C6：全部缺口都来不及
      const arrive = pick.tier === 1 ? pick.gap.from : addDays(res.today, pick.method.d);
      const purchase = pick.tier === 1 ? addDays(arrive, -(params.leadTime + pick.method.d)) : res.today;
      const end = fastEnd(res, params, pick, slowArrive1);
      const cap = batchCap(d, params);
      const qty = Math.min(fastNeed(res, d, arrive, end), cap);  // C4：单批上限，超线下一轮继续拆
      if (qty <= 0) break;                                      // 已无亏空
      const carry = projectedStock(res, d, arrive);
      const line = {
        purchase, method: pick.method.m, qty, arrive,
        useBy: addDays(arrive, (carry + qty) / d),
        // §4 #14：随行说明直接取用的字段（不在 UI 层重算）
        gapFrom: pick.gap.from, tier: pick.tier, end, cap, arriveStock: carry,
        urgent: pick.tier === 2, kind: "fast",
      };
      lines.push(line);
      res = withExtra(res, params, [line]);                      // 并入在途 → 回到循环开头重新推演
    }
    lines.res = res;
    lines.exhausted = exhausted;
    return lines;
  }
  // 【已退役】原 ladderLines（锚点 + 桥接量 + 逐批降级 + 末批精确缩减，381–444 行）整体删除：
  //   排批改由 fastLines 逐亏空点迭代承担，主力周期批由 planB 用 buildCycleLines 接管。
  //   随之消失的重复/失效项：bridgeQty(299) / capLastQty(308) / ladderAnchor(320) / pickChainMethod(360)
  //   / chainBatch(368，含 arrive−safety、useBy 含 safety×d) / lateDays(406)。见方案 §2.7.6。

  // —— 首批采购日（贴断点尽量晚）——
  // 断点 = 时间轴首缺口（含现有+在途 ETA 推演）；把首批采购延后到
  //   「断点 − (提前期+本渠道运输)」，使首批到货日 = 断点（贴断点，零缓冲 · C11/C14）；若该日已过则今天。
  //   C14：日期侧 safety 全部去掉 —— 缓冲只由批量维度（cycleQty 的 d×(周期+安全)）产生，不再"早到几天"。
  function exhaustDate(res) {
    return res.firstGap ? res.firstGap.from : res.rows[res.rows.length - 1].useBy;
  }
  // baseOverride：传入「过滤后的首个真实缺口日」替代默认断点（C10 口径统一；不传则用 exhaustDate）
  function firstBuyDate(res, params, chan, baseOverride) {
    const base = baseOverride || exhaustDate(res);
    const fp = addDays(base, -(params.leadTime + chan.d));
    return fp < res.today ? res.today : fp;
  }

  // —— 每批采购量（渠道区分；均向上取整）——
  // 海运/陆运（慢/主力）：周期批 = 日均×(补货周期 + 安全库存)，简称 batchQty
  // 空运（快）：每批只按 日均×补货周期（不叠安全库存，靠频次+贴断点缓冲），简称空运周期批
  // 单批上限保护（用户规则）：海运单批 > 日均×(周期+安全)×2 → 拆 2 批；空运单批 > 日均×(周期+安全) → 拆 2 批。
  //   = 海运 ≤ 2×(周期+安全) 天量、空运 ≤ (周期+安全) 天量（旧口语「海运18倍/空运8倍」均指日均倍数，实际按上口径取）。
  //   本工具按上表给出单批，天然不越线；若日后把数批合并成一单下，可按此线拆开执行。
  //   C18/F3：非空运分支复用 batchCap（⌈d×(周期+安全)⌉），表达式只在一处定义。
  function cycleQty(d, params, method) {
    return method.m === "空运"
      ? Math.ceil(d * Math.max(1, params.cycle))
      : batchCap(d, params);
  }

  // 主通道批序列：首批从 fp（贴断点日）起，之后每「补货周期」下一批，共预排 n 批（周期批）。
  //   到货日 = 采购日 + (提前期+运输)；到货间隔 = 补货周期。
  //   每批预计用完 = 到货日 + (到货时库存 + 本批数量) ÷ d；首行到货时库存用时间轴推演，
  //   之后每批到货时的残留 = 上批剩余 − 期间(周期天)消耗（海运每批覆盖 > 周期，残留逐批累增
  //   = 提前积累的安全垫；空运每批恰覆盖一个周期，残留≈0，靠首批到货时已垫的缓冲衔接）。
  //   C17/F2：去掉 `lateDays: 0` —— 数学上每批覆盖 cycle+safety 天 > 间隔 cycle 天，该字段恒 0、无人消费。
  function buildCycleLines(res, params, chan, fp, n, firstCarry) {
    const d = res.d;
    const qty = cycleQty(d, params, chan);
    const transit = params.leadTime + chan.d;
    const lines = [];
    let carry = firstCarry !== undefined ? firstCarry : projectedStock(res, d, addDays(fp, transit));
    for (let i = 0; i < n; i++) {
      const pd = addDays(fp, i * params.cycle);
      const arrive = addDays(pd, transit);
      const useBy = addDays(arrive, (carry + qty) / d);
      lines.push({ purchase: pd, method: chan.m, qty, arrive, useBy, kind: "main" });
      carry = Math.max(0, carry + qty - d * params.cycle);   // 到下一批到货时的残留
    }
    lines.qty = qty;
    return lines;
  }

  // 展示裁剪：只保留「采购日 ≤ 今天 + 30 天」的批次（衔接优先，只列出近 30 天真正要下的单），
  // 若 30 天内一批都没有则保留最早 1 批；总行数封顶 8（防大批长链）。
  function trimHorizon(lines, today, horizonDays, maxRows) {
    const h = addDays(today, horizonDays || 30);
    const n = maxRows || 8;
    const kept = [];
    for (const l of lines) {
      if (kept.length >= n) break;
      if (l.purchase <= h) kept.push(l);
    }
    if (!kept.length && lines.length) kept.push(lines[0]);
    for (const k of Object.keys(lines)) if (!/^\d+$/.test(k)) kept[k] = lines[k];   // 迁移附加属性(linked 等)
    return kept;
  }

  // planA：纯单渠道分批。不作为独立方案对外暴露，仅被以下场景复用：
  //   组合方案（方案一 / 方案三）的 A 档「主力到货前不断货」、E1「在途接得住」、单一渠道退化分支。
  // 首批采购日贴断点（到货 = 断点，零缓冲 · C14）；之后每补货周期一批（周期批），共预排 N 批。
  // gapFrom：口径统一的断点（C10，传过滤后的首个真实缺口日；不传则用 res.firstGap.from）
  function planA(res, params, mainMethod, fpOverride, title, gapFrom) {
    const d = res.d, slow = mainMethod || seaMethod(params);
    const fp = fpOverride || firstBuyDate(res, params, slow);
    const transit = params.leadTime + slow.d;
    const a1 = addDays(fp, transit);
    const allLines = buildCycleLines(res, params, slow, fp, 4);
    const lines = trimHorizon(allLines, res.today);
    const qty = allLines.qty;
    const isAir = slow.m === "空运";
    const gFrom = gapFrom || res.firstGap.from;

    // 缓冲天数 = 断点 − 首批到货日（C14 后到货日 = 断点，故正常为 0 = 贴线零缓冲）
    const buf = dayDiff(gFrom, a1);
    let risk;
    if (buf < 0) risk = "首批 " + fmtMD(a1) + " 到货前即断货（断点 " + fmtMD(gFrom) + "），纯" + slow.m + "不可行，需提前采购或加快";
    else if (buf === 0) risk = "首批到货 " + fmtMD(a1) + " 贴断点（零缓冲，靠周期批逐批垫出安全垫）";
    else risk = "首批到货前不断货（缓冲 " + buf + " 天）";

    const chNote = (slow.m === "海运" && +params.sea <= 0)
      ? "海运未填写（0），按默认 " + SEA_DEFAULT + " 天估算；" : "";
    const fpNote = fp > res.today
      ? "首批延后至 " + fmtMD(fp) + " 采购（贴断点·" + fmtMD(a1) + " 到货 = 断点）"
      : "首批今天下单";
    const qNote = isAir
      ? ("每批 = 日均×补货周期（空运周期批）=" + qty + " 件")
      : ("每批 = 日均×(补货周期+安全库存)（周期批）=" + qty + " 件");
    return { title: title || ("纯" + slow.m + "·分批"),
      note: chNote + "全程只用" + slow.m + "：" + qNote + "，" + fpNote + "；之后每 " + params.cycle + " 天一批，预排 " + lines.length + " 批",
      risk, lines };
  }

  // 方案一（组合·含逾期未提货）：快+慢接力，防断货且资金均衡。
  //   本函数复用为方案三（组合·不含逾期）：唯一差异是传入的 res 口径 ——
  //   方案一传含逾期的推演结果，方案三传 excludeOverdue 的推演结果，并用 titleOverride 换标题。
  // 若所选物流使组合退化为单一渠道：仅空运 → 与方案二等价（仅引用）；其余直接展开纯渠道明细。
  function planB(res, params, titleOverride) {
    const d = res.d, slow = enabledSlowest(params), fast0 = fastest(params);
    const noMethod = options(params).length === 0
      ? "未填写任何运输方式，按海运 " + SEA_DEFAULT + " 天默认估算；" : "";
    const title = titleOverride || "方案一（组合·含逾期未提货）";

    // —— 单一渠道退化 ——
    // 仅空运：方案一（含逾期）与方案二（含逾期纯空运）等价 → 折叠引用、不重复计算；
    //   方案三（不含逾期，titleOverride 存在）口径不同 —— 有逾期批次时采购日/批量均不等，
    //   不能折叠到含逾期的方案二，必须用传入的 res（不含逾期口径）独立展开明细。
    if (slow.m === fast0.m) {
      if (slow.m === "空运") {
        if (titleOverride) {
          const aAir = planA(res, params, fast0, null, title);
          return { title, note: noMethod + "仅空运一种方式可用（不含逾期口径，独立展开）：" + aAir.note, risk: aAir.risk, lines: aAir.lines };
        }
        return { title, collapsedTo: "plan2", note: "仅空运一种方式，等价于纯空运分批（口径见时间轴两列）", lines: [] };
      }
      const a0 = planA(res, params, slow, null, title);
      return { title, note: noMethod + "仅" + slow.m + "一种方式可用，等价于纯" + slow.m + "分批：" + a0.note, risk: a0.risk, lines: a0.lines };
    }

    const slowTransit = params.leadTime + slow.d;
    const slowArrive = addDays(res.today, slowTransit);       // 主力首批到货日
    // 真实缺口（C7：主力接得住的断货不算缺口）；断点口径统一为过滤后的首个真实缺口日（C10）
    const rg = realGaps(res, d, slowArrive);
    const gapFrom = rg.length ? rg[0].from : res.firstGap.from;
    const fpSlow = firstBuyDate(res, params, slow, gapFrom);

    // —— A 档：主力到货前不会断货（断点 ≥ 主力首批到货日）——
    // 直接主力周期批，无需快补；首批贴断点延后，到货缓冲不足 safety 只影响提示文案。
    if (gapFrom >= slowArrive) {
      const a = planA(res, params, slow, fpSlow, title, gapFrom);
      const bufDays = dayDiff(gapFrom, slowArrive);          // 主力首批到货时可再撑的天数（到断点）
      const qDesc = slow.m === "空运" ? "⌈d×周期⌉" : "⌈d×(周期+安全)⌉";
      // C19/§9.2：方案级 note 精简为一行「条件 → 结果 + 角色」，逐批判据移到批次行（lineNote）
      const note = noMethod + "A 档：断点 " + fmtMD(gapFrom) + " ≥ 主力首批到货日 " + fmtMD(slowArrive)
        + " → 不排快补 ｜ 主力 = " + slow.m + "，每批 " + cycleQty(d, params, slow) + " = " + qDesc
        + (bufDays < params.safety ? " ｜ 到货时缓冲 " + bufDays + " 天 < 安全库存 " + params.safety + " 天" : "");
      return { title, note, risk: a.risk, lines: a.lines };
    }

    // —— C-1（原 E1）：在途接得住 → 不排快补 ——
    // 主力到货前不存在「主力接不住」的真实缺口（只剩不足 1 天量 / 当天衔接的噪声段）→ 只下主力周期批。
    if (!rg.length) {
      const a = planA(res, params, slow, fpSlow, title, gapFrom);
      const g0 = res.firstGap;
      const qDesc = slow.m === "空运" ? "⌈d×周期⌉" : "⌈d×(周期+安全)⌉";
      const noise = (g0 && g0.to && g0.missQty > 0)
        ? "（断货 " + fmtMD(g0.from) + "→" + fmtMD(g0.to) + " 仅 " + g0.missQty + " 件，不足 1 天量，忽略）" : "";
      return { title,
        note: noMethod + "C-1：现有+在途可撑到主力首批到货 " + fmtMD(slowArrive) + " → 不排快补" + noise
          + " ｜ 主力 = " + slow.m + "，每批 " + cycleQty(d, params, slow) + " = " + qDesc,
        risk: a.risk, lines: a.lines };
    }

    // —— C-2（原 E2）：逐缺口迭代排快补 ——
    // 每轮重新推演 → 方式优先（慢→快）→ 档1/档2 → 终点 → 逐亏空点定量 → 并入在途；上限 8 轮（C5）
    const fLines = fastLines(res, params, slow, slowArrive);
    const resAll = fLines.res || res;
    const exhausted = !!fLines.exhausted;
    // 主力周期批：首批今天下单（到货 = slowArrive），首行 carry = 快补批并入后主力到货时的真实剩余
    const slowCarry = projectedStock(resAll, d, slowArrive);
    const sLines = buildCycleLines(resAll, params, slow, res.today, 4, slowCarry);
    const all = fLines.concat(sLines);
    const lines = trimHorizon(all, res.today);

    const nFast = fLines.length;
    const fastSum = fLines.reduce((s, l) => s + l.qty, 0);
    const byMethod = {};
    for (const l of fLines) { const o = byMethod[l.method] || (byMethod[l.method] = { n: 0, qty: 0 }); o.n++; o.qty += l.qty; }
    const methodNames = Object.keys(byMethod);
    const perMethodDesc = methodNames.map(m => m + " " + byMethod[m].n + " 批 " + byMethod[m].qty + " 件").join("、");
    const urgentN = fLines.filter(l => l.urgent).length;
    const candDesc = fastCands(params, slow.m).map(c => c.m).join(" → ") || "无";
    const slowQty = cycleQty(d, params, slow);
    const fastDesc = nFast
      ? ("快补 " + nFast + " 批共 " + fastSum + " 件" + (methodNames.length > 1 || urgentN ? "（" + perMethodDesc + "）" : "")
        + (urgentN ? "，其中 " + urgentN + " 批需紧急采购" : ""))
      : "快补 0 批";
    // §9.2：note 精简为一行「角色 + 量」，逐批判据（缺口日/档位/终点/上限）随批次行渲染（lineNote）
    const note = noMethod + "主力 = " + slow.m + "（每批 " + slowQty + " = " + (slow.m === "空运" ? "⌈d×周期⌉" : "⌈d×(周期+安全)⌉") + "）"
      + " ｜ 快补候选 = " + candDesc + " ｜ " + fastDesc + " ｜ 主力 " + fmtMD(slowArrive) + " 到货交接";

    // 不可避免断货段（§4 #11）：快补批并入后仍存在的真实缺口 = 谁都救不了的那几段
    const leftover = realGaps(resAll, d, slowArrive);
    const risks = [];
    if (!nFast && exhausted) risks.push("⚠️ " + rg.length + " 段断货均来不及补（最快渠道也赶不上），建议催提在途");
    else if (leftover.length) {
      const days = leftover.reduce((s, g) => s + dayDiff(g.to, g.from), 0);
      const qty = leftover.reduce((s, g) => s + g.missQty, 0);
      risks.push("⚠️ " + leftover.length + " 段断货快补赶不上（共 " + days + " 天 / 约 " + qty + " 件）："
        + leftover.map(g => fmtMD(g.from) + "→" + fmtMD(g.to)).join("、") + "，建议催提在途");
    }
    return { title, note, risk: risks.join("；"), lines };
  }

  // 方案二（纯空运·含逾期）：应急/最快基准，仅强制空运，不管其他渠道是否填写。
  // 空运未填(0)时回退默认 5 天；首批延后到贴断点（firstBuyDate）。
  function planAir(res, params) {
    const filled = +params.air > 0;
    const airDays = filled ? +params.air : AIR_DEFAULT;
    const airMethod = { m: "空运", d: airDays };
    const a = planA(res, params, airMethod, null, "方案二（纯空运·含逾期）");
    const warn = filled ? "" : "（空运运输天数未填写，按默认 " + AIR_DEFAULT + " 天估算）";
    return { title: "方案二（纯空运·含逾期）",
      note: warn + a.note,
      risk: a.risk, lines: a.lines };
  }

  /* ---------- 批次行说明（lineNote） ---------- */
  // 每批只写这一批自己的判据与公式，供「随行说明」使用。
  // 2026-09-14 用户要求结果区不逐行附说明 → 网页与 Markdown 均默认不渲染；函数保留备用
  // （快补批的 lines[] 仍带 gapFrom / tier / end / cap / arriveStock，恢复渲染时直接取用）。
  function lineNote(l, d, params) {
    if (!l) return "";
    if (l.kind === "fast") {
      return "补缺口 " + fmtMD(l.gapFrom)
        + " ｜ 档" + l.tier + (l.tier === 2 ? "（跳过提前期，⚠️需紧急采购）" : "")
        + " ｜ 采购 " + fmtMD(l.purchase) + " ｜ 到货 " + fmtMD(l.arrive)
        + " ｜ 终点 " + fmtMD(l.end) + "（更慢方式到货即接管）"
        + " ｜ 量 " + l.qty + " = ⌈d×(终点−到货)⌉ − 到货时库存 " + Math.round(l.arriveStock == null ? 0 : l.arriveStock)
        + " ｜ 上限 " + l.cap + " = ⌈d×(周期+安全)⌉";
    }
    const q = cycleQty(d, params, { m: l.method });
    return "主力周期批 ｜ 每批 " + q + " = " + (l.method === "空运" ? "⌈d×周期⌉" : "⌈d×(周期+安全)⌉")
      + " ｜ 到货 = 采购 + 提前期 + 运输 ｜ 用完 = 到货 + (到货时库存 + 本批) ÷ d";
  }

  /* ---------- Markdown ---------- */
  // 两口径行对齐：按稳定键（kind+到货日+方式+数量）匹配，不再依赖「非 overdue 行索引」——
  //   防止 analyze 行序将来改动导致两列静默错位；匹配不到时返回 null（该格显示「—」），不静默错配。
  //   同键多行（同方式同到货同数量）按序消费，显示上等价。toMarkdown 与 UI 层共用。
  function rowKey(r) { return r.kind + "|" + (+r.arrive) + "|" + (r.method || "") + "|" + r.qty; }
  function alignNoRows(res, resNo) {
    const map = new Map();
    if (!resNo) return map;
    const byKey = new Map();
    for (const nr of resNo.rows) {
      if (nr.kind === "overdue") continue;
      const k = rowKey(nr);
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(nr);
    }
    for (const r of res.rows) {
      if (r.kind === "overdue") continue;
      const arr = byKey.get(rowKey(r));
      map.set(r, (arr && arr.length) ? arr.shift() : null);
    }
    return map;
  }

  function toMarkdown(res, plans, params, resNo) {
    const d = res.d;
    // 不含逾期口径（方案三）的行 → 时间轴第 6 列；两口径按稳定键一一对应
    const noMap = alignNoRows(res, resNo);
    const noOf = r => noMap.get(r) || null;
    const noMark = r => (r.gap ? " 🔴 " + fmtMD(r.gap.from) + " 起断" : "") + (r.endGap ? " 🔴 " + fmtMD(r.endGap.from) + " 起断（无后续）" : "");
    let md = "===SKU:" + (res.sku.code || "未命名") + "===\n\n";
    md += "**库存状态**：" + res.status + "（" + res.statusNote + "）";
    if (res.trend) md += "；" + res.trend;
    md += "\n\n";
    md += "日均30天 " + res.sku.daily30 + " ｜ 日均7天 " + res.sku.daily7 + " ｜ 日均变化率 " + (res.sku.changeRate > 0 ? "+" : "") + res.sku.changeRate + "%\n\n";
    if (res.pickupAlert) {
      md += res.pickupAlert + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "\n\n";
    }
    md += "**库存时间轴**：\n";
    md += "| 采购 | 方式 | 数量 | 预计到货 | 预计用完(含逾期) | 预计用完(不含逾期) |\n|---|---|---|---|---|---|\n";
    const n0 = noOf(res.rows[0]);
    const g0 = gapMark(res.rows[0].gap, res.rows[0].endGap);
    md += "| — | — | 当前库存 " + res.rows[0].qty + " 件 | — | " + fmtMD(res.rows[0].useBy)
      + (g0 ? " " + g0 : "")
      + " | " + (n0 ? fmtMD(n0.useBy) + noMark(n0) : "—") + " |\n";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? fmtMD(parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = fmtMD(r.arrive) + " (逾期未提)";
      else if (r.tight) arrive = fmtMD(r.arrive) + " ⚠️贴线";
      else arrive = fmtMD(r.arrive);
      const g = gapMark(r.gap, r.endGap);
      const nr = noOf(r);
      const noCell = r.kind === "overdue" ? "不纳入计算" : (nr ? fmtMD(nr.useBy) + noMark(nr) : "—");
      md += "| " + pd + " | " + r.method + " | " + r.qty + " | " + arrive + " | " + fmtMD(r.useBy) + (g ? " " + g : "") + " | " + noCell + " |\n";
    }
    // 累计缺口汇总行（§4 #15）：主力首批到货前所有真实缺口段（含逾期口径）
    const gs = gapSummary(res, params);
    md += "| 累计缺口 | — | " + (gs.n ? gs.n + " 段 / " + gs.days + " 天 / " + gs.qty + " 件" : "无") + " | — | — | — |\n";
    md += "\n*口径：含逾期 = 方案一 / 方案二（逾期未提货批次计入库存）；不含逾期 = 方案三（逾期未提货批次不纳入计算）*\n";
    if (res.anomaly.length) {
      md += "\n⚠️ 以下在途批次未纳入计算：\n";
      for (const a of res.anomaly) md += "  - " + (a.method || "未知方式") + " " + a.qty + " 件（" + a.reason + "）\n";
    }
    md += "\n**采购方案**：\n";
    for (const p of plans) {
      md += "\n- **" + p.title + "**：" + p.note + (p.risk ? "（" + p.risk + "）" : "") + "\n";
      for (const l of p.lines) {
        // 2026-09-14 用户要求：结果区（网页与 Markdown）不再逐行附说明；公式见「计算说明」面板
        md += "  - " + fmtMD(l.purchase) + "采购，" + l.method + l.qty + "件，预计到货" + fmtMD(l.arrive) + "，预计用完 " + fmtMD(l.useBy) + "\n";
      }
    }
    return md;
  }

  return { parse, analyze, planA, planB, planAir, toMarkdown, alignNoRows, lineNote, batchCap, cycleQty, realGaps, gapSummary, gapMark, slowArriveOf, fmt, fmtMD, parseDate };
})();

/* ============================================================
 * UI 层（仅测试用，接入网站时只保留上面模块即可）
 * ============================================================ */
function getParams() {
  return {
    cycle: +document.getElementById("p-cycle").value,
    leadTime: +document.getElementById("p-lead").value,
    safety: +document.getElementById("p-safety").value,
    sea: +document.getElementById("p-sea").value,
    land: +document.getElementById("p-land").value,
    air: +document.getElementById("p-air").value,
  };
}
function getBaseDate() {
  const v = document.getElementById("p-base").value;
  return v ? new Date(v) : new Date();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
/* 浮现说明（§9.4）：TT(显示文本, 浮层内容)。浮层文本经 esc 转义 → 内部可用 <br>，但不要出现 ASCII 双引号 */
function TT(txt, tip) { return '<span class="tip" data-tip="' + esc(tip) + '">' + txt + "</span>"; }
/* 术语浮动注释：给 .tip 元素绑定 hover 浮层（支持多行 br，不裁剪、不随滚动偏移） */
function bindTips(rootEl) {
  if (!rootEl) return;
  rootEl.querySelectorAll(".tip").forEach(el => {
    el.addEventListener("mouseenter", function () {
      const box = document.createElement("div");
      box.className = "tipbox";
      box.innerHTML = el.getAttribute("data-tip") || "";
      document.body.appendChild(box);
      const r = el.getBoundingClientRect();
      const tw = box.offsetWidth;
      let left = r.left;
      if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
      box.style.left = left + "px";
      box.style.top = (r.bottom + 6) + "px";
      el._box = box;
    });
    el.addEventListener("mouseleave", function () { if (el._box) { el._box.remove(); el._box = null; } });
  });
}


/* 计算说明面板（§9.3 一级/二级标题重组）：
   一 参数定义 ｜ 二 输入字段 ｜ 三 基础公式 ｜ 四 方案一（详述 4.1~4.7）
   五 方案二 ｜ 六 方案三 ｜ 七 口径校验
   术语带 hover 浮现（.tip）；数值随填写值实时变化；同一定义只写一次，别处用 T() 复用 */
function renderCalcDoc() {
  const p = getParams();
  const base = document.getElementById("p-base").value || "今天";
  const V = s => '<span class="val">' + s + "</span>";
  const C = s => "<code>" + s + "</code>";
  const tbl = (head, rows) => '<table class="def"><tr>' + head.map(t => "<th>" + t + "</th>").join("")
    + "</tr>" + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</table>";
  const mth = (d, extra) => d > 0 ? V(d + " 天") : V("0") + "（未启用" + (extra || "") + "）";
  const escAttr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const T = (txt, tip) => '<span class="tip" data-tip="' + escAttr(tip) + '">' + txt + "</span>";
  const cap = Math.max(1, p.cycle + p.safety);

  /* —— 共用术语（定义只在这里出现一次，正文用 T() 复用） —— */
  const Td = T("d", "日均7天 = 最近 7 天日销量均值；全表统一的消耗口径，缺失时用「销量7天 ÷ 7」推导");
  const Tcyc = T("补货周期", "相邻两批的采购间隔天数，同时是单批覆盖天数的基准");
  const Tlead = T("提前期", "下单之后、供应商实际发货之间的准备天数（备货、报关等）");
  const Tsafe = T("安全库存", "每批到货时希望手里仍保留的库存天数，用于吸收运输延误与销量波动");
  const Tcap = T("单批上限", "= ⌈d×(补货周期+安全库存)⌉；只作 min() 上界，不产生实际量（C4）");
  const Tmain = T("主力", "页面已启用（填了天数 > 0）的方式里运输最慢的那个；三种全填 0 时回退海运 30 天");
  const TfastCand = T("快补候选", "页面已启用、且不是主力的方式，按运输天数从慢到快排列；填 0（未启用）的方式不参与");
  const TslowArrive = T("主力首批到货日", "= 今天 + 提前期 + 主力运输天数");
  const Tbreak = T("断点", "时间轴推演出的首个「库存耗尽、下一批接不上」的日子（含现有 + 在途预计到货）");
  const Tgap = T("真实缺口", "同时满足三条：缺量 ≥ 1 天量、结束日 > 开始日、开始日 < 主力首批到货日");
  const Ttier = T("档 1 / 档 2", "档1：缺口日 − 今天 ≥ 提前期 + 运输 → 到货日 = 缺口日（贴缺口、零缓冲）；档2：缺口日 − 今天 ≥ 运输 → 到货日 = 今天 + 运输（跳过提前期，标「需紧急采购」）");
  const Tend = T("终点", "本批只负责「更慢的方式到不了的那一段」= 更慢候选今天下单能到的日子；本批已是最慢候选 → 主力首批到货日");
  const Tneed = T("逐亏空点定量", "从到货日沿供给点推演（原有在途到货 + 终点），到第一个亏空点即补该缺口；零缓冲，缺多少补多少");
  const Tpipeline = T("管道库存靠提前下单填充", "批次按到货间隔 = 补货周期滚动预排；海运/陆运每批 = ⌈d×(周期+安全)⌉，比到货间隔多出安全库存天量 → 逐批垫出缓冲；空运每批 = ⌈d×周期⌉，恰抵一个到货间隔，靠频次覆盖");
  const Tpickup = T("催提在途", "已发生的断货由在途接住，建议催促提前提货");

  /* —— 当前参数下的角色（供正文引用） —— */
  const opts = [{ m: "海运", d: +p.sea }, { m: "陆运", d: +p.land }, { m: "空运", d: +p.air }].filter(x => x.d > 0);
  const main = opts.length ? opts.reduce((a, b) => a.d > b.d ? a : b) : { m: "海运", d: 30 };
  const cands = opts.filter(x => x.m !== main.m).sort((a, b) => b.d - a.d);
  const bd = document.getElementById("p-base").value ? new Date(document.getElementById("p-base").value) : new Date();
  const fMD = d => String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mainTxt = main.m + " " + main.d + " 天";
  const candTxt = cands.length ? cands.map(c => c.m + " " + c.d + " 天").join(" → ") : "无（只剩一种方式）";
  const slowArriveTxt = fMD(addD(bd, p.leadTime + main.d));

  /* ================= 一、参数定义 ================= */
  let h = "<h3>一、参数定义 <span style='color:var(--muted);font-weight:400;font-size:12px'>（鼠标移到带下划线的术语可查看浮现说明）</span></h3>";
  h += tbl(["参数", "当前值", "公式 / 口径"], [
    ["基准日 base", V(base), "一切日期的起算点；采购日不会早于基准日，已过则只提示「须立即下单」"],
    [Tcyc + " cycle", V(p.cycle + " 天"), "滚动下单间隔；同时是单批覆盖天数的基准"],
    [Tlead + " leadTime", V(p.leadTime + " 天"), "下单 → 供应商发货的准备时间"],
    [Tsafe + " safety", V(p.safety + " 天"), "只进入" + C("⌈d×(周期+安全)⌉") + "（批量维度）；<b>日期侧不含 safety</b>（C14）"],
    [T("海运 sea", "海运的运输时效（天）。填 0 = 本次不用海运"), mth(p.sea, "；三种全填 0 时按默认 30 天估算"), "0 = 本次不用该方式"],
    [T("陆运 land", "陆运的运输时效（天）。填 0 = 本次不用陆运"), mth(p.land), "0 = 本次不用该方式"],
    [T("空运 air", "空运的运输时效（天）。填 0 时方案二按默认 5 天估算；方案一/三不会用默认值兜底"), mth(p.air, "；方案二仍按默认 5 天估算"), "0 = 本次不用该方式"],
  ]);
  h += '<div class="note">默认值：海运 30 / 陆运 7 / 空运 5。' + T("填 0 = 该渠道本次不用", "不参与方案一 / 方案三（组合）的快补候选；方案二恒按空运，空运填 0 时取默认 5 天") + "。</div>";
  h += '<div class="note">⚠️ 安全库存口径：当前为固定 ' + p.safety + ' 天缓冲，未计入销量波动与运输延误分布。若日销波动大，建议按 ' + C("Z × σ × √(提前期+运输)") + " 估算后回填（待优化）。</div>";

  /* ================= 二、输入字段定义 ================= */
  h += "<h3>二、输入字段定义</h3>";
  h += tbl(["输入字段", "含义", "说明"], [
    [Td + " 日均7天", "最近 7 天日销量均值", "统一消耗口径；所有「预计用完」「断货」都用它"],
    ["可用库存", "当前可售库存", "时间轴起点"],
    [T("在途批次", "已采购、尚未到货的批次；其预计到货参与时间轴推演"), "已采购未到货", "必须有" + T("预计到货", "批次预计送达日期，须为 4 位年份 YYYY-MM-DD，否则列为异常不参与") + "且为 4 位年份才纳入"],
    [T("日均变化率", "日均7天相对日均30天的涨跌幅度"), "日均7天 vs 日均30天", C("(日均7 − 日均30) ÷ 日均30") + "；|值| > 10% 出趋势提示，不参与计算"],
    [T("逾期未提货", "预计到货日已过（≤ 今天）但货仍未到、且采购未超 90 天的批次"), "到货日 ≤ 今天（且采购 ≤ 90 天）", "方案一 / 二计入库存；方案三视为到不了，不纳入计算"],
    [T("超期在途", "采购距今 > 90 天仍未提货的批次"), "采购 > 90 天未提货", "底部红字列出，三方案均忽略不计"],
    [T("异常批次", "无预计到货，或日期非 4 位年份"), "无到货日 / 日期异常", "底部红字列出，不参与计算"],
  ]);

  /* ================= 三、基础计算公式 ================= */
  h += "<h3>三、基础计算公式</h3>";
  h += tbl(["计算项", "公式", "说明"], [
    ["可售天数", C("可用库存 ÷ d"), "低于" + Tcyc + " → 红字「需立即提货」"],
    [T("主力周期批", "到货间隔 = 补货周期；每批比到货间隔多覆盖安全库存天量 → 逐批垫出缓冲"), C("⌈d×(" + p.cycle + "+" + p.safety + ")⌉（= " + cap + " 天量）"), "海运 / 陆运每批；空运 = " + C("⌈d×" + p.cycle + "⌉")],
    [Tcap, C("⌈d×(" + p.cycle + "+" + p.safety + ")⌉（= " + cap + " 天量）"), "只作 min() 上界，不产生实际量（C4）"],
    ["到货日", C("采购日 + 提前期 + 运输"), "档 2 = 今天 + 运输（跳过提前期）"],
    ["预计用完", C("到货日 + (到货时库存 + 本批数量) ÷ d"), "断货期库存为 0，损失销量不计入消耗"],
    [T("断货判定", "到货日时剩余 < −d（即耗尽日比到货日晚 1 天以上）才算断货；不足 1 天量忽略、当天能衔接上不算断货"), C("到货日剩余 < −d"), "口径 2 容差"],
    [T("缺货件数 missQty", "断货期间损失的销量，属机会成本，不计入库存消耗、不从后续库存扣减"), C("⌈d × 断货天数⌉"), "断货期损失销量"],
    [T("贴线", "到货时剩余库存不足 1 天用量，缓冲极薄，轻微延误即断货"), C("到货时剩余 < 1 天用量"), "红字「⚠️贴线」"],
    ["库存状态", "30 天无断货 = 充足；≤ 10 天 = 紧急；10–30 天 = 注意", "以时间轴推算为准"],
    [T("输出范围", "各方案只列「采购日 ≤ 今天 + 30 天」的批次；30 天内无需下单则显示最早一批；方案行数封顶 8"), C("采购日 ≤ 今天 + 30 天，≤ 8 行"), "每种方式首次采购日用红字标出"],
  ]);

  /* ================= 四、方案一（详述） ================= */
  h += "<h3>四、方案一（组合 · 含逾期未提货）</h3>";
  h += '<div class="note">当前参数：' + Tmain + " = <b>" + mainTxt + "</b> ｜ " + TfastCand + " = <b>" + candTxt + "</b> ｜ " + TslowArrive + " = <b>" + slowArriveTxt + "</b></div>";

  h += "<h4>4.1 角色划分</h4>";
  h += tbl(["角色", "定义", "本页取值"], [
    [Tmain, "已启用（d > 0）方式中运输最慢者；全 0 → 海运 30 天", V(mainTxt)],
    [TfastCand, "已启用、且非主力，按运输天数慢→快（慢的优先，省运费）", V(candTxt)],
    [TslowArrive, C("今天 + 提前期 + 主力运输") + "（快补的交接点，一到货主力接管）", V(slowArriveTxt)],
  ]);

  h += "<h4>4.2 情况 A · 主力到货前不断货</h4>";
  h += tbl(["条件", "处理"], [
    [Tbreak + " ≥ " + TslowArrive, "直接排" + Tmain + "周期批，<b>无需快补</b>"],
    ["首批采购日", C("max(今天, 断点 − 提前期 − 主力运输)") + " → 到货日 = 断点（贴断点、零缓冲 · C14）"],
    [T("缓冲不足", "断点 ≥ 到货日、但 < 到货日 + 安全库存 → 到货时库存为正但不足安全库存，不构成断货，仅文案提示"), "不改变方案结构，只在说明里提示"],
  ]);

  h += "<h4>4.3 情况 B · 单渠道退化</h4>";
  h += tbl(["条件", "处理"], [
    ["只填了一种运输方式", "组合无意义，退化为单一渠道"],
    ["仅空运", "等价于方案二（纯空运），折叠引用、不重复计算；方案三因口径不同会独立展开"],
    ["仅海运 / 仅陆运", "直接展开该渠道的周期批明细"],
  ]);

  h += "<h4>4.4 情况 C · 快补衔接（" + Tbreak + " &lt; " + TslowArrive + "）</h4>";
  h += tbl(["子情况", "条件", "处理"], [
    ["C-1 · 在途接得住", "主力到货日前没有" + Tgap, "只下主力周期批，提示" + Tpickup + "（4.5）"],
    ["C-2 · 补不上", "存在" + Tgap, "逐缺口迭代排快补，主力批照排（4.6）"],
  ]);
  h += '<div class="note">' + Tgap + " 三条过滤：① 缺量 ≥ 1 天量 ② 结束日 > 开始日（当天能衔接上不算）③ 开始日 < " + TslowArrive + "（主力接得住的断货不算缺口）。</div>";

  h += "<h4>4.5 C-1 · 在途接得住 → 不排快补</h4>";
  h += tbl(["条件", "处理"], [
    ["主力到货日前无" + Tgap, "只排主力周期批；若有不足 1 天量的噪声段，说明里注明「忽略」"],
    ["提示", "建议" + Tpickup + "；已发生的断货由在途接住，不会为了补它而提前下单"],
  ]);

  h += "<h4>4.6 C-2 · 补不上 → 逐缺口迭代</h4>";
  h += '<div class="note">每轮：重新推演' + Tgap + " → 方式优先试探 → 定档位与到货日 → 算" + Tend + " → " + Tneed + " → 取" + Tcap + " → 本批并入在途、回到循环开头。上限 <b>8 轮</b>（C5）。</div>";
  h += tbl(["步骤", "规则"], [
    ["① 试探方式", "按缺口日升序，对每个缺口 <b>" + T("方式优先", "慢→快逐个方式，每个方式先试档 1 再试档 2；第一个满足者即选中（C15）—— 慢方式便宜，不被快方式的档 1 抢走") + "</b>：" + candTxt + "，逐个试 " + Ttier],
    ["② 定档位", Ttier],
    ["③ 定采购 / 到货日", "档 1：" + C("采购 = 缺口日 − 提前期 − 运输") + "、" + C("到货 = 缺口日") + "；档 2：" + C("采购 = 今天") + "、" + C("到货 = 今天 + 运输")],
    ["④ 算终点", Tend + "（「空运只补一点点」：空运只补「空运到货日 → 陆运到货日」这一段 · C16）"],
    ["⑤ 算数量", Tneed + " → " + C("qty = ⌈d×(终点−到货)⌉ − 到货时库存") + "，再取 " + C("min(" + Tcap + ")")],
    ["⑥ 并入重推", "本批并入在途 → 回到①重新推演（C12 逐轮重算：空运救急后库存恢复，后续自动降级陆运）"],
    ["全部来不及", "口径 2.3：这次缺货就不管、往后看；所有缺口都来不及 → 不排快补，主力批照排并提示" + Tpickup + "（C6）"],
  ]);
  h += tbl(["档", "判据", "采购日", "到货日", "提醒"], [
    ["档 1", C("缺口日 − 今天 ≥ 提前期 + 运输"), C("缺口日 − 提前期 − 运输"), "缺口日（贴缺口 · 零缓冲）", "—"],
    ["档 2", C("缺口日 − 今天 ≥ 运输"), "今天", C("今天 + 运输") + "（不含提前期）", "<b>⚠️ 需紧急采购</b>"],
  ]);
  h += '<div class="note">' + Tend + "：本批不是最慢候选 → " + C("今天 + 更慢候选运输") + "；本批已是最慢候选 → " + TslowArrive + "。更慢方式一到货即接管，本批不越界。</div>";

  h += "<h4>4.7 不可避免断货段</h4>";
  h += tbl(["项", "口径"], [
    ["定义", "快补批全部并入后<b>仍然存在</b>的" + Tgap + " = 谁都救不了的那几段"],
    ["输出", "「⚠️ N 段断货快补赶不上（共 X 天 / 约 Y 件）：MM-DD→MM-DD、…，建议" + Tpickup + "」"],
    ["注意", "与快补批次解耦 —— 不会因为要补这段就把快补提前下单"],
  ]);

  /* ================= 五、方案二 ================= */
  h += "<h3>五、方案二（纯空运 · 含逾期）</h3>";
  h += tbl(["项", "口径"], [
    ["运输方式", "恒用" + T("空运", "方案二强制只用空运，空运填 0 时取默认 5 天（与是否填写无关）") + "，不管海运/陆运是否填写"],
    ["每批数量", T("空运周期批", "⌈d×补货周期⌉；空运快、可高频补，不再叠安全库存") + " = " + C("⌈d×" + p.cycle + "⌉")],
    ["首批采购日", "贴断点：" + C("max(今天, 断点 − 提前期 − 空运运输)") + " → 到货 = 断点"],
    ["逾期口径", "同方案一（逾期未提货计入库存）"],
    ["用途", "应急 / 最快基准"],
  ]);

  /* ================= 六、方案三 ================= */
  h += "<h3>六、方案三（组合 · 不含逾期）</h3>";
  h += tbl(["项", "口径"], [
    ["与方案一的关系", "算法<b>完全相同</b>（主力 / 快补 / 逐缺口迭代 / 终点 全部复用），唯一差异见下"],
    ["唯一差异", "逾期未提货批次视为「到不了」—— 不并入库存、不进时间轴（对应时间轴「预计用完(不含逾期)」列）"],
    ["后果", "断货点通常更早、更容易触发快补与更多批次；用于评估「逾期批次一直提不到」的最坏情况"],
    ["边界 ①", "断货点比方案一更早时，说明开头自动给出「断货提前 N 天、主因逾期未提 Z 件」对照行"],
    ["边界 ②", "仅空运一种方式时，独立展开不含逾期口径明细（<b>不</b>折叠到含逾期的方案二）"],
    ["边界 ③", "SKU 无逾期未提批次时与方案一完全一致，折叠为一行提示"],
  ]);

  /* ================= 七、口径校验 ================= */
  h += "<h3>七、口径校验</h3>";
  h += tbl(["项", "口径"], [
    ["时间轴两列", T("预计用完(含逾期)", "方案一 / 方案二口径：逾期未提货批次计入库存") + " ｜ " + T("预计用完(不含逾期)", "方案三口径：逾期未提货批次不纳入计算，故断货点通常更早")],
    ["断货标注", "两列同格式：区间 = 「🔴断货 MM-DD→MM-DD 缺 N 件」（起始日 → 下次到货日 + 该段缺货件数）；开放式 = 「🔴断货 MM-DD 起（无后续到货）」。各列只标本口径的断货"],
    ["状态徽章", "顶部状态徽章与「距缺货 N 天」按<b>含逾期</b>口径"],
    ["90 天 / 异常", "采购 > 90 天未提货、无到货日、日期非 4 位年份 → 列出但不参与计算"],
    ["输出范围", C("采购日 ≤ 今天 + 30 天") + "，方案行数封顶 8；每种方式首次采购日红字标出"],
  ]);
  h += "<h4>7.1 为什么每批只需覆盖「周期」/「周期+安全」？</h4>";
  h += "<table><tr><td>" + Tpipeline + "。到货时间只由下单日与运输时效决定，任何「首批加大」都不会让货更早到 —— 所以不加" + T("首批加大批", "旧设计曾让首批 = ⌈d×(周期+本渠道运输)⌉，已废弃：等价于提前多排若干周期批，不如直接按周期预排省资金") + "。首批采购日贴断点，到货前由现有 + 在途库存覆盖。</td></tr></table>";
  h += '<div class="note">快补口径（v8 起）：逐缺口遍历 + 方式优先 + 逐亏空点 + 终点；日期侧不含安全库存，缓冲只由批量 ' + C("⌈d×(周期+安全)⌉") + " 逐批垫出。</div>";

  const body = document.getElementById("calc-doc-body");
  body.innerHTML = h;
  bindTips(body);
}

/* 方案悬浮说明：鼠标移到方案标题旁的 ? 上显示（复用 .tip / .tipbox 浮动注释） */
const PLAN_TIP = {
  "方案一": "组合方案 · 含逾期未提货口径。逾期未提货批次（预计到货日已过、货仍未到）视为「会到货」，计入库存推演（时间轴「含逾期」列）。主力 = 已启用方式中最慢者；快补候选 = 主力之外按运输天数慢→快（未填的方式不参与）。三段判定：断点 ≥ 主力首批到货日 → 直接主力周期批；主力到货日前没有真实缺口 → 不排快补、提示催提在途；否则逐缺口迭代排快补 —— 每轮按「方式优先」（慢→快逐个方式，先档1 再档2）定方式与到货日，按终点（更慢候选到货日 / 主力首批到货日）用逐亏空点算出本批缺口量、不超过单批上限，再并入在途重新推演（上限 8 轮）。日期侧不含安全库存（缓冲只由批量 ⌈d×(周期+安全)⌉ 产生）。",
  "方案二": "纯空运 · 应急/最快基准。全部只用空运（空运填 0 时按默认 5 天估算），不论海运/陆运是否填写。每批 = ⌈日均×补货周期⌉（空运周期批），首批贴断点（到货 = 断点，零缓冲），之后每补货周期一批。逾期口径与方案一相同：逾期未提货计入库存。",
  "方案三": "组合方案 · 不含逾期口径（保守）。算法与方案一完全相同（主力 / 快补 / 逐缺口迭代 / 终点 全部复用），唯一差异：逾期未提货批次视为「到不了」——不并入库存、也不进时间轴（对应时间轴「不含逾期」列）。因此断货点通常更早、更容易触发快补与更多批次。用于评估「逾期批次一直提不到」的最坏情况：断货点早于方案一时，说明开头自动给出「提前 N 天、主因逾期未提 Z 件」对照。仅空运一种方式时独立展开明细（不折叠到含逾期的方案二）；SKU 无逾期未提批次时与方案一完全一致，折叠为一行提示。",
};

function run() {
  const out = document.getElementById("output");
  const params = getParams();
  const base = getBaseDate();
  const text = document.getElementById("input").value;
  renderCalcDoc();
  const skus = ReplenishModule.parse(text);
  if (!skus.length) { out.innerHTML = '<div class="err">未识别到 SKU 数据，请检查输入格式。</div>'; return; }

  const tally = { 紧急: 0, 注意: 0, 充足: 0 };
  let html = "";
  for (const sku of skus) {
    const res = ReplenishModule.analyze(sku, params, base);
    if (res.error) { html += '<div class="sku-card"><div class="err">' + esc(res.error) + "</div></div>"; continue; }
    // 方案三口径：逾期未提货批次视为「到不了」（不并入库存）；行结构与 res 一一对应，供时间轴并排展示两列
    const resNo = ReplenishModule.analyze(sku, params, base, { excludeOverdue: true });
    const plans = [
      ReplenishModule.planB(res, params),
      ReplenishModule.planAir(res, params),
      null,
    ];
    if (!res.overdue.length) {
      // 无逾期未提批次 → 两口径推演完全相同，方案三折叠为一行对照提示（不再重复展示明细）
      plans[2] = { title: "方案三（组合·不含逾期）", note: "无逾期未提批次，与方案一完全一致", lines: [] };
    } else {
      plans[2] = ReplenishModule.planB(resNo, params, "方案三（组合·不含逾期）");
      // 断货点对照：不含逾期断货更早 → note 顶部点明「提前 N 天 + 主因逾期未提 Z 件」
      const g1 = res.firstGap, g3 = resNo.firstGap;
      if (g1 && g3 && g3.from < g1.from) {
        const dd = Math.round((g1.from - g3.from) / 86400000);
        plans[2].note = "⚠️ 不催提的话，断货提前 " + dd + " 天（" + ReplenishModule.fmtMD(g1.from) + " → " + ReplenishModule.fmtMD(g3.from) + "），主因逾期未提 " + res.overdueQty + " 件：" + plans[2].note;
      }
    }
    const md = ReplenishModule.toMarkdown(res, plans, params, resNo);
    const badge = res.status === "充足" ? "green" : res.status === "注意" ? "orange" : "red";
    tally[res.status] = (tally[res.status] || 0) + 1;

    // 默认收起，点击标题展开/收起
    html += '<details class="sku-card">';
    html += '<summary><span class="sku-title">' + esc(sku.code || "未命名") + '</span>'
      + TT('<span class="badge ' + badge + '">' + res.status + "</span>", "30 天内无断货 = 充足；距缺货 ≤ 10 天 = 紧急；10–30 天 = 注意（按含逾期口径的时间轴推算）");
    html += '<span class="sum-meta">' + esc(res.statusNote) + " ｜ 日均7天 " + sku.daily7 + " ｜ 可用 " + res.rows[0].qty + " 件"
      + (res.pickupAlert ? " ｜ " + TT("需提货", "可售天数 < 补货周期 → 现有库存撑不到下一批，须立即提货") : "") + "</span>";
    html += '<button class="copy-btn" data-md="' + esc(md.replace(/\n/g, "\\n")) + '" onclick="event.stopPropagation();event.preventDefault();copyMd(this)">复制 Markdown</button></summary>';
    html += '<div class="sku-body">';
    html += '<div class="status-line">SKU: ' + esc(sku.code || "未命名") + " ｜ " + esc(res.statusNote) + (res.trend ? "；" + esc(res.trend) : "") + "</div>";
    html += '<div class="status-line">日均30天 ' + sku.daily30 + ' ｜ 日均7天 ' + sku.daily7 + ' ｜ '
      + TT("日均变化率 " + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%", "(日均7天 − 日均30天) ÷ 日均30天；|值| > 10% 出趋势提示，不参与计算") + "</div>";

    if (res.pickupAlert) {
      html += '<div class="warn">' + esc(res.pickupAlert) + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "</div>";
    }

    // 不含逾期口径（方案三）的行 → 第 6 列；两口径按稳定键一一对应（alignNoRows）
    const noMap = ReplenishModule.alignNoRows(res, resNo);
    // 断货标注：抽公共函数（原三处重复），两列完全同格式；数值本身可 hover 出公式（§9.4 D 类）
    const gapTip = "缺量 = ⌈d × 断货天数⌉；断货期库存为 0，损失销量不扣减后续库存";
    const endTip = "时间轴末尾耗尽且无后续到货（开放式断货，无截止日）";
    // 文本取模块公共函数 gapMark（§4 #15 抽公共，与 toMarkdown 同源），此处只包裹 hover 公式（§9.4 D 类）
    const markAll = r => (r.gap ? ' <span class="tip" data-tip="' + esc(gapTip) + '" style="color:var(--red);font-weight:600">' + ReplenishModule.gapMark(r.gap) + "</span>" : "")
      + (r.endGap ? ' <span class="tip" data-tip="' + esc(endTip) + '" style="color:var(--red);font-weight:600">' + ReplenishModule.gapMark(null, r.endGap) + "</span>" : "");

    html += "<table><tr>"
      + "<th>" + TT("采购", "档1 = max(今天, 缺口日 − 提前期 − 运输)；档2 = 今天；主力周期批 = 上批采购日 + 补货周期") + "</th>"
      + "<th>" + TT("方式", "主力 = 页面已启用(d>0)方式中最慢者；快补 = 主力之外按运输天数慢→快逐个试探的第一个可行者（未填的方式不参与）") + "</th>"
      + "<th>" + TT("数量", "主力周期批 = ⌈d×(补货周期+安全库存)⌉（空运 = ⌈d×补货周期⌉）；快补批 = ⌈d×(终点−到货)⌉ − 到货时库存，且 ≤ ⌈d×(周期+安全)⌉") + "</th>"
      + "<th>" + TT("预计到货", "= 采购日 + 提前期 + 运输天数；档2 = 今天 + 运输（跳过提前期）") + "</th>"
      + "<th>" + TT("预计用完(含逾期)", "= 到货日 + (到货时库存 + 本批数量) ÷ d；断货期库存为 0，损失销量不计入消耗。逾期未提货批次计入库存") + "</th>"
      + "<th>" + TT("预计用完(不含逾期)", "同上，但逾期未提货批次不纳入计算（方案三口径）") + "</th>"
      + "</tr>";
    const n0 = noMap.get(res.rows[0]) || null;
    html += "<tr><td>—</td><td>—</td><td>当前库存 " + res.rows[0].qty + " 件</td><td>—</td><td>" + ReplenishModule.fmtMD(res.rows[0].useBy)
      + markAll(res.rows[0])
      + "</td><td>" + (n0 ? ReplenishModule.fmtMD(n0.useBy) + markAll(n0) : "—") + "</td></tr>";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? ReplenishModule.fmtMD(ReplenishModule.parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = '<td>' + ReplenishModule.fmtMD(r.arrive) + ' ' + TT('<span style="color:var(--red)">(逾期未提)</span>', "预计到货日 ≤ 今天、货仍未到，且采购未超 90 天的批次；方案一/二计入库存，方案三不纳入计算") + "</td>";
      else if (r.tight) arrive = '<td class="gap">' + ReplenishModule.fmtMD(r.arrive) + " " + TT("⚠️贴线", "到货时剩余库存不足 1 天用量，缓冲极薄，轻微延误即断货") + "</td>";
      else arrive = "<td>" + ReplenishModule.fmtMD(r.arrive) + "</td>";
      const nr = noMap.get(r) || null;
      const noCell = r.kind === "overdue"
        ? TT('<span style="color:var(--muted)">不纳入计算</span>', "方案三口径：逾期未提货批次视为「到不了」，不并入库存、不进时间轴")
        : (nr ? ReplenishModule.fmtMD(nr.useBy) + markAll(nr) : "—");
      html += "<tr><td>" + pd + "</td><td>" + esc(r.method) + "</td><td>" + r.qty + "</td>" + arrive + "<td>" + ReplenishModule.fmtMD(r.useBy) + markAll(r) + "</td><td>" + noCell + "</td></tr>";
    }
    html += "</table>";
    // 累计缺口汇总行（§4 #15 / §9.4）：与 toMarkdown 同源 gapSummary（= 主力首批到货前的 realGaps 之和）
    const gs = ReplenishModule.gapSummary(res, params);
    html += '<div style="font-size:12px;color:var(--muted);margin:-4px 0 6px">'
      + TT("累计缺口 " + (gs.n ? gs.n + " 段 / " + gs.days + " 天 / " + gs.qty + " 件" : "无"),
        "主力首批到货前所有真实缺口段（realGaps）的缺量之和；不足 1 天量、当天能衔接上的、主力接得住的段均不计入")
      + " ｜ 口径：含逾期 = 方案一 / 方案二（逾期未提货批次计入库存）；不含逾期 = 方案三（逾期未提货批次不纳入计算）</div>";
    if (res.anomaly.length) {
      html += '<div class="warn">⚠️ 以下 ' + res.anomaly.length + ' 批在途未纳入计算：</div><ul style="color:#d93025;font-size:13px;margin:2px 0 0 18px;padding:0">';
      for (const a of res.anomaly) html += "<li>" + esc(a.method || "未知方式") + " " + a.qty + " 件（" + esc(a.reason) + "）</li>";
      html += "</ul>";
    }

    for (const p of plans) {
      const tipTxt = PLAN_TIP[p.title.slice(0, 3)] || "";
      html += '<div class="plan"><h4>' + esc(p.title)
        + (tipTxt ? ' <span class="tip q" data-tip="' + esc(tipTxt) + '">?</span>' : "")
        + "</h4>";
      html += '<div class="note">' + esc(p.note) + "</div>";
      if (p.risk) html += '<div class="note risk">' + esc(p.risk) + "</div>";
      if (p.lines.length) {
        html += "<ol>";
        const seenMethod = {};
        for (const l of p.lines) {
          const firstOf = !seenMethod[l.method];
          seenMethod[l.method] = true;
          const pd = ReplenishModule.fmtMD(l.purchase);
          // 2026-09-14 用户要求：结果区不再逐行附说明（lineNote 保留在模块里，默认不渲染）
          html += "<li>" + (firstOf ? '<b style="color:var(--red)">' + pd + "</b>" : pd) + "采购，"
            + esc(l.method) + l.qty + "件，预计到货" + ReplenishModule.fmtMD(l.arrive) + "，预计用完 " + ReplenishModule.fmtMD(l.useBy)
            + (l.urgent ? " " + TT("⚠️需紧急采购", "档2：缺口日−今天 ≥ 运输，但 < 提前期+运输 → 跳过提前期、今天必须下单，否则来不及") : "")
            + "</li>";
        }
        html += "</ol>";
      }
      html += "</div>";
    }
    html += "</div></details>";
  }

  const bar = '<div class="tally-bar">共 ' + skus.length + " 个 SKU："
    + '<span class="badge red">紧急 ' + (tally.紧急 || 0) + "</span> "
    + '<span class="badge orange">注意 ' + (tally.注意 || 0) + "</span> "
    + '<span class="badge green">充足 ' + (tally.充足 || 0) + "</span>"
    + '<button class="copy-btn" onclick="toggleAll(true)">全部展开</button>'
    + '<button class="copy-btn" onclick="toggleAll(false)">全部收起</button></div>';
  out.innerHTML = bar + html;
  bindTips(out);
}

function toggleAll(open) {
  document.querySelectorAll("#output details.sku-card").forEach(d => { d.open = open; });
}

function copyMd(btn) {
  const md = btn.getAttribute("data-md").replace(/\\n/g, "\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制 Markdown", 1500); });
  } else {
    const ta = document.createElement("textarea"); ta.value = md; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); btn.textContent = "已复制";
  }
}

function loadSample() {
  const t = new Date();
  const f = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const off = n => { const x = new Date(t); x.setDate(x.getDate() + n); return f(x); };
  document.getElementById("input").value = [
    "===SKU:DEMO-SKU-A===",
    "SKU: DEMO-SKU-A",
    "销量30天: 767", "销量7天: 186", "日均30天: 25.57", "日均7天: 26.57", "日均变化率: +3.9%",
    "在仓库库存: 171", "待发货库存: 40", "可用库存: 131", "可售天数: 4",
    "在途库存: 84",
    "在途明细（按采购单/批次逐单列出，预计到货=采购时间+运输时效）：",
    "- 绿色通道: 在途 6 件（采购时间 " + off(-663) + "，运输时效 0 天）",
    "- 空运: 在途 78 件（采购时间 " + off(-4) + "，运输时效 7 天，预计到货≈" + off(3) + "）",
    "",
    "===SKU:DEMO-001===",
    "SKU: DEMO-001",
    "销量30天: 9000", "销量7天: 2100", "日均30天: 300", "日均7天: 300", "日均变化率: +8%",
    "在仓库库存: 600", "待发货库存: 0", "可用库存: 3000", "可售天数: 10",
    "在途库存: 2400",
    "在途明细（按采购单/批次逐单列出，预计到货=采购时间+运输时效）：",
    "- 陆运: 在途 900 件（采购时间 " + off(-5) + "，运输时效 8 天，预计到货≈" + off(3) + "）",
    "- 海运: 在途 1500 件（采购时间 " + off(-1) + "，运输时效 26 天，预计到货≈" + off(25) + "）",
  ].join("\n");
  run();
}
function clearAll() { document.getElementById("input").value = ""; document.getElementById("output").innerHTML = ""; }

/* 基准日默认今天 */
document.getElementById("p-base").value = new Date().toISOString().slice(0, 10);
document.getElementById("p-base").addEventListener("change", renderCalcDoc);
bindTips(document.querySelector(".params"));   // 参数 label 的浮现说明
renderCalcDoc();
</script>
</body>
