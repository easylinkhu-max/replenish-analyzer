<script>
/* ============================================================
 * 核心模块 ReplenishModule（可整体复制到你的网站复用）
 * API:
 *   parse(text) -> [sku]                解析粘贴文本
 *   analyze(sku, params, baseDate) -> res  核心计算（可直接传结构化数据对象，绕过 parse）
 *   planB/planAir(res, params) -> plan  两方案（组合推荐 / 纯空运应急）
 *   planA(res, params, chan, fp, title)  纯单渠道分批，供 planB 内部复用
 *   toMarkdown(res, plans) -> string    生成 Markdown
 * ============================================================ */
const ReplenishModule = (function () {

  const SEA_DEFAULT = 30;   // 三种运输方式全填 0（都没启用）时回退此默认值（页面默认与其一致）
  const AIR_DEFAULT = 5;    // 空运填 0（未启用）时方案二按此默认值估算（与页面默认一致）
  const STALE_DAYS = 90;    // 在途超 3 个月未提货 → 列出但忽略不计

  /* ---------- 日期工具 ---------- */
  function parseDate(s) {
    if (!s) return null;
    const m = String(s).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + Math.ceil(n)); return x; }
  function dayDiff(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }
  function fmt(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtMD(d) { return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const sum = (arr, k) => arr.reduce((s, b) => s + b[k], 0);

  /* ---------- 解析 ---------- */
  function parse(text) {
    const skus = [];
    const parts = String(text).split(/===SKU/i);
    for (let p of parts) {
      p = p.replace(/^[：:]\s*\S+\s*=*/, "").trim();
      if (!p) continue;
      const sku = parseOne(p);
      if (sku.code || sku.daily7) skus.push(sku);
    }
    return skus;
  }
  function parseOne(block) {
    const sku = { code: "", daily7: 0, daily30: 0, changeRate: 0, available: 0, sellDays: 0, sales7: 0, inTransit: [] };
    for (const raw of block.split("\n")) {
      const line = raw.trim();
      let m;
      if ((m = line.match(/^SKU\s*[：:]\s*(\S+)/))) sku.code = m[1];
      else if ((m = line.match(/日均7天\s*[：:]\s*([\d.]+)/))) sku.daily7 = parseFloat(m[1]);
      else if ((m = line.match(/日均30天\s*[：:]\s*([\d.]+)/))) sku.daily30 = parseFloat(m[1]);
      else if ((m = line.match(/日均变化率\s*[：:]\s*([+\-]?[\d.]+)/))) sku.changeRate = parseFloat(m[1]);
      else if ((m = line.match(/可用库存\s*[：:]\s*([\d.]+)/))) sku.available = parseFloat(m[1]);
      else if ((m = line.match(/可售天数\s*[：:]\s*([\d.]+)/))) sku.sellDays = parseFloat(m[1]);
      else if ((m = line.match(/销量7天\s*[：:]\s*([\d.]+)/))) sku.sales7 = parseFloat(m[1]);
      else if ((m = line.match(/^\s*[-*]\s*([^：:\s]+)\s*[：:]\s*在途\s*(\d+)\s*件/))) {
        const pd = line.match(/采购时间\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const eta = line.match(/预计到货\s*[≈=~]?\s*([\d]{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
        const ts = line.match(/运输时效\s*(\d+)/);
        sku.inTransit.push({ method: m[1], qty: parseInt(m[2]), purchaseDate: pd ? pd[1] : "", eta: eta ? eta[1] : "", transitDays: ts ? parseInt(ts[1]) : 0 });
      }
    }
    if (!sku.daily7 && sku.sales7) sku.daily7 = sku.sales7 / 7;
    return sku;
  }

  /* ---------- 核心计算 ---------- */
  function analyze(sku, params, baseDate) {
    const d = sku.daily7;
    if (!d || d <= 0) return { error: "SKU " + (sku.code || "") + " 日均7天缺失或为0，无法计算" };
    const today = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());

    const overdue = [], upcoming = [], anomaly = [];
    for (const b of sku.inTransit) {
      // 采购超 3 个月仍未提货 → 列出但忽略不计（不进时间轴、不计入方案）
      const pdDate = parseDate(b.purchaseDate);
      const age = pdDate ? dayDiff(today, pdDate) : null;
      if (age !== null && age > STALE_DAYS) {
        anomaly.push(Object.assign({}, b, { stale: true, reason: "采购 " + fmt(pdDate) + "，已 " + age + " 天未提货（超 3 个月），忽略不计" }));
        continue;
      }
      const eta = parseDate(b.eta);
      if (!eta) { anomaly.push(Object.assign({}, b, { reason: b.eta ? "预计到货日期格式异常" : "无预计到货日期" })); continue; }
      if (eta <= today) overdue.push(Object.assign({}, b, { etaDate: eta })); else upcoming.push(Object.assign({}, b, { etaDate: eta }));
    }
    upcoming.sort((a, b) => a.etaDate - b.etaDate);
    overdue.sort((a, b) => (parseDate(a.purchaseDate) || today) - (parseDate(b.purchaseDate) || today));
    const overdueQty = sum(overdue, "qty");

    const rows = [];
    let stock = sku.available;
    const firstUseBy = addDays(today, stock / d);
    rows.push({ kind: "current", qty: Math.round(stock), arrive: today, useBy: firstUseBy });

    for (const b of overdue) {
      stock += b.qty;
      rows.push({ kind: "overdue", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate || today, useBy: addDays(today, stock / d) });
    }

    let curDate = today;
    for (const b of upcoming) {
      const days = dayDiff(b.etaDate, curDate);
      const remaining = stock - d * days;
      // 断货区间归属「耗尽批」：gap.from（耗尽日）恰等于上一行 useBy → 标注挂到上一行
      // （即 rows 末行，断货开始的那一天），让「🔴断货 MM-DD→…」紧随耗尽批的「预计用完」显示，
      // 而非挂在晚到的本批行后。gap 语义 = 「本行用完日 到 下一批到货日」之间的断货。
      let gap = null;
      if (remaining < -1e-6) {
        gap = { from: addDays(curDate, stock / d), to: b.etaDate, missQty: Math.ceil(-remaining) };
        const prev = rows[rows.length - 1];
        if (prev) prev.gap = gap;
      }
      const tight = remaining >= -1e-6 && remaining < d;
      const newStock = Math.max(remaining, 0) + b.qty;
      rows.push({ kind: "batch", method: b.method, qty: b.qty, purchaseDate: b.purchaseDate, arrive: b.etaDate, useBy: addDays(b.etaDate, newStock / d), tight, stock: Math.round(newStock) });
      stock = newStock;
      curDate = b.etaDate;
    }

    // 末尾库存耗尽：最后一条记录之后无任何到货，自耗尽日起视为开放式断货（无截止日）
    const endGap = { from: addDays(curDate, stock / d), to: null, missQty: 0, terminal: true };
    rows[rows.length - 1].endGap = endGap;

    let firstGap = null;
    for (const r of rows) if (r.gap) { firstGap = r.gap; break; }
    if (!firstGap) firstGap = endGap;

    let status = "充足", statusNote = "30 天内无断货";
    if (firstGap) {
      const dt = dayDiff(firstGap.from, today);
      if (dt <= 10) { status = "紧急"; statusNote = "距缺货 " + dt + " 天"; }
      else if (dt <= 30) { status = "注意"; statusNote = "距缺货 " + dt + " 天"; }
      else { status = "充足"; statusNote = "缺货在 " + dt + " 天后（>30 天）"; }
    }
    const trend = Math.abs(sku.changeRate) > 10 ? "日均变化率 " + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%，" + (sku.changeRate > 0 ? "涨速需警惕" : "跌速需关注") : "";

    // 提货提醒：可售天数低于补货周期 → 现有库存撑不到下一批，须立即提货/补货
    const sellDays = sku.available / d;
    const pickupAlert = sellDays < params.cycle
      ? "⚠️ 可售 " + (Math.round(sellDays * 10) / 10) + " 天 < 补货周期 " + params.cycle + " 天，需立即提货"
      : "";

    return { sku, today, d, rows, overdue, overdueQty, anomaly, firstGap, status, statusNote, trend, sellDays, pickupAlert, finalStock: stock, finalDate: curDate };
  }

  // 时间轴推演：date 时刻的预计剩余库存 = 现有 + 逾期在途 + date 前到货的批次 − 期间消耗（不封底取 0）
  // planA 首批剩余库存、快补首单 carry 都用它，确保方案考虑现有/在途库存
  function projectedStock(res, d, date) {
    let stock = res.sku.available + res.overdueQty, cursor = res.today;
    for (const r of res.rows) {
      if (r.kind !== "batch") continue;
      if (r.arrive > date) break;
      stock = Math.max(stock - d * dayDiff(r.arrive, cursor), 0) + r.qty;
      cursor = r.arrive;
    }
    return Math.max(stock - d * dayDiff(date, cursor), 0);
  }

  // 海运兜底（未填写海运时取默认 SEA_DEFAULT 天；现在只在"完全没填任何方式"时用到）
  function seaMethod(p) { return { m: "海运", d: +p.sea > 0 ? +p.sea : SEA_DEFAULT }; }
  function options(p) { return [{ m: "海运", d: +p.sea }, { m: "陆运", d: +p.land }, { m: "空运", d: +p.air }].filter(x => x.d > 0); }
  // 最快方式：从已启用方式中取最快；全部为 0 时回退海运
  function fastest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d < b.d ? a : b) : seaMethod(p); }
  // 主力（慢方式）：只从已启用方式（d>0）中取最慢，0=不用该方式；全部为 0 时回退海运
  function enabledSlowest(p) { const o = options(p); return o.length ? o.reduce((a, b) => a.d > b.d ? a : b) : seaMethod(p); }
  // 快补桥接量：空运/陆运等快通道阶梯接力时每批只采够「提前期 + 安全库存 + 本通道运输天数」，
  // 仅覆盖「下单→到货」窗口 + 安全缓冲，够衔接即可、不囤货。
  // 例：d=26.57、提前期2、安全2、空运7 → ⌈26.57×11⌉ = 293（而非填满整段缺口的 638）
  // 单批上限（用户规则）：空运/陆运每批 ≤ 日均×(补货周期+安全库存)（默认 9 天量）。
  //   raw   = 未受上限约束的原始桥接量（"不囤货线"，超过即为多买）
  //   cap   = 单批上限
  //   bridge= min(raw, cap) —— 实际下单量
  //   注：clamp 必须在末批缩减之前生效，否则末批上界（= 桥接量 + 安全库存量）会随 raw 失控。
  function bridgeQty(d, params, method) {
    const raw = Math.ceil(d * (params.leadTime + params.safety + method.d));
    const cap = Math.ceil(d * (params.cycle + params.safety));
    return { bridge: Math.min(raw, cap), raw, cap };
  }
  // 末批上限 = 单批上限 + 一个安全库存量（末批最多比普通批多买一个 safety 的量，把缓冲补到 safety）。
  //   分别取整再相加（而非 ⌈d×(周期+2×安全)⌉），避免合并取整少算 1~2 件导致误截断。
  //   数学保证：末批量 ≤ 本批桥接量 + 安全库存量 ≤ cap + 安全库存量 = capLast（6000 组扫描 0% 违反）。
  function capLastQty(d, params) {
    return Math.ceil(d * (params.cycle + params.safety)) + Math.ceil(d * params.safety);
  }

  // —— 阶梯锚点：快补真正要接的缺口起点（不是"最早断货日"）——
  // T(渠道) = 今天 + 采购提前期 + 该渠道运输天数（该渠道今天下单能到的最早日期）
  //   · 若 T 这天库存已耗尽（projectedStock ≤ 0）→ 锚点 = T：断货已发生，快补今天下单也救不回，只能尽早补
  //   · 否则 → 锚点 = T 之后第一个「库存耗尽日」（rows 里 gap.from / endGap.from 中第一个 ≥ T 的）
  // 为什么不用 firstGap：firstGap 是"不采购会断在哪天"，可能远早于快补能到达的时刻。
  //   典型如 TPQ-B：今天已断货（firstGap=09-09），但在途 20 件 09-15 到、能撑到 10-03；
  //   空运最早 09-16 到货，对 09-09→09-15 这段无能为力 → 真正该补的是 10-03 之后。
  // 为什么不能取任意行 useBy：首行(current)的 useBy 按"无在途"计算，会严重误判
  //   （JIN-CUI-LA 首行显示 09-23，但 09-22 有 4000 件到货，真实耗尽是 10-08）。
  function ladderAnchor(res, params, chan) {
    const d = res.d;
    const T = addDays(res.today, params.leadTime + chan.d);
    if (projectedStock(res, d, T) <= 0) return T;
    for (const r of res.rows) {
      const p = r.gap ? r.gap.from : (r.endGap ? r.endGap.from : null);
      if (p && p >= T) return p;
    }
    return res.rows[res.rows.length - 1].useBy;
  }

  // 快补方式选取（用户规则 2026-09-10：时间足够时优先 海运 > 陆运 > 空运；没填的方式不参与）。
  // 判"来得及"时不再要求比锚点再早 safety 天，分两档（由慢到快取第一个满足者）：
  //   第一档（去安全、保留提前期）：锚点 − 今天 ≥ 提前期 + 本方式运输天数
  //   全部不满足 → 第二档（去提前期，只算运输）：锚点 − 今天 ≥ 本方式运输天数
  //   仍不满足 → 报断货（按断货逻辑续：看在途、首批贴锚点倒推、能延后就延后，不提前抢跑占款）。
  // 注意「锚点」必须用各候选共用的尺子 = 最快候选的锚点（快补最早能到的那刻起真实缺口起点）。
  //   不能用候选自己的锚点：它恒 ≥ 今天+提前期+本方式运输（耗尽更早则直接锚到自身到货日），
  //   会导致第一档恒成立、永远选中最慢者（空运永不启用）。最快候选锚点才能区分"陆运赶得上否"。
  //   另注：最快候选的锚点恒 ≥ 今天+提前期+其运输（耗尽更早→锚点=自身到货日），故档 2/兜底
  //   通常在多方式场景不会触发——它只在「最快方式也救不回缺口」时才兜底到空运并按断货处理。
  function pickFast(res, params, slowM) {
    const cands = options(params).filter(x => x.m !== slowM).sort((a, b) => b.d - a.d);  // 慢→快
    if (!cands.length) return null;
    const fastest = cands[cands.length - 1];
    const ref = ladderAnchor(res, params, fastest);   // 共用参照锚点
    const runway = dayDiff(ref, res.today);           // 距锚点天数
    const anchorOf = c => ladderAnchor(res, params, c);
    for (const c of cands) if (runway >= params.leadTime + c.d) return { method: c, anchor: anchorOf(c) };  // 档1
    for (const c of cands) if (runway >= c.d) return { method: c, anchor: anchorOf(c) };                     // 档2
    return { method: fastest, anchor: ref };                                                               // 兜底：报断货，按断货逻辑续
  }

  // 续接批方式选取（用户规则 2026-09-10：首批之后窗口变宽，逐批降级到「来得及的最慢方式」）。
  // 续接批是硬需求到货日 A = 前批用完日 − safety：到货日由需求决定，方式只影响采购日（越慢越要早下单）。
  //   判「来得及」⇔ 今天 ≤ A − (leadTime + 本方式运输天数)（采购日不早于今天，即仍能准时到货）。
  //   在「已启用且非主力」的方式里按运输天数从慢到快取第一个满足者（时间够就优先陆运）；
  //   都不满足 → 取最快的兜底（chainBatch 会钳到今天下单并标 lateDays 提示赶不上）。
  // 窗口随链条推进变宽：A(i+1) = A(i) + 批数量 ÷ d（由 chainBatch 的 useBy 公式推出），
  //   故首批/第 2 批窗口最紧（可能只能空运），越靠后的批越宽（可降级陆运，省运费）。
  function pickChainMethod(res, params, slowM, needArrive) {
    const cands = options(params).filter(x => x.m !== slowM).sort((a, b) => b.d - a.d);  // 慢→快
    if (!cands.length) return null;
    for (const c of cands) if (dayDiff(needArrive, res.today) >= params.leadTime + c.d) return c;  // 来得及
    return cands[cands.length - 1];   // 都不来得及 → 最快兜底
  }
  // 衔接批次：期望「上批用完日 − 安全库存」到货；采购日早于今天则钳到今天并顺延到货，标记是否赶不上
  function chainBatch(prevUseBy, transit, today, params, qty, d) {
    let arrive = addDays(prevUseBy, -params.safety);
    let purchase = addDays(arrive, -transit);
    let lateDays = 0;
    if (purchase < today) { purchase = today; arrive = addDays(today, transit); lateDays = Math.max(dayDiff(arrive, prevUseBy), 0); }
    return { purchase, arrive, useBy: addDays(arrive, (params.safety * d + qty) / d), lateDays };
  }
  // 阶梯接力（快补能赶上锚点 或 赶不上 都走这里）：
  //   快补（最快/来得及的最慢方式）与主力（慢方式）各自「今天下单太早/只能早下」的原则不同：
  //   主力慢方式今天下单（到货慢，须尽早占管道）；快补首批<b>贴锚点延后下单</b>（到货日 = 锚点−安全库存），
  //   每批按<b>桥接量</b>滚动续接，直到慢方式首批能接上 → 之后转慢方式滚动担主力。
  //   快补每批仅覆盖「提前期+安全+运输」天且 ≤ 单批上限，够衔接即可，不囤货；
  //   锚点由 ladderAnchor 给出（断货中取最早到货日 T；否则取 T 之后第一个耗尽日），
  //   若锚点太近、贴锚点日已过则首批改为今天下单。
  function ladderLines(res, params, fast, slow, anchor) {
    const d = res.d;
    const bridge = bridgeQty(d, params, fast).bridge;         // 快补批次：桥接量（已受单批上限约束）
    const fastTransit = params.leadTime + fast.d, slowTransit = params.leadTime + slow.d;
    const slowArrive1 = addDays(res.today, slowTransit);      // 主力（慢）首批到货日
    const lines = [];

    // 快补第 1 单：首批贴锚点延后下单（fp = max(今天, 锚点−safety−leadTime−快补运输)），到货日 = 锚点−safety，
    // 尽量晚下单少占款；锚点较远则今天不必下单。到货时真实剩余库存 = 现有 + 在途 − 消耗（时间轴推演）；
    // 若锚点太近被钳到今天、且到货已落入断货期，推演结果自然为 0，不会乐观高估（否则用完日偏晚、少排一单）
    const fp1 = firstBuyDate(res, params, fast, anchor);
    const fastArrive1 = addDays(fp1, fastTransit);
    const carry1 = projectedStock(res, d, fastArrive1);
    let fU = addDays(fastArrive1, (carry1 + bridge) / d);
    lines.push({ purchase: fp1, method: fast.m, qty: bridge, arrive: fastArrive1, useBy: fU });

    // 快补滚动续接：需求到货日 A = 前批用完日 − safety，只补到「主力首批到货日」为止 —— 主力一到立刻交接。
    // 每批**独立判定方式**（pickChainMethod）：在「非主力、来得及」的方式里取最慢者 → 首批窗口最紧往往只能
    // 空运，后续批窗口已变宽则自动降级陆运（省运费）。数量 = 该方式的桥接量（已受单批上限约束）。
    let guard = 0, lastFast = null;
    while (dayDiff(slowArrive1, fU) > 0 && guard++ < 8) {
      const needArrive = addDays(fU, -params.safety);
      const m = pickChainMethod(res, params, slow.m, needArrive) || fast;
      const q = bridgeQty(d, params, m).bridge;
      const c = chainBatch(fU, params.leadTime + m.d, res.today, params, q, d);
      lastFast = { purchase: c.purchase, method: m.m, qty: q, arrive: c.arrive, useBy: c.useBy, lateDays: c.lateDays };
      lines.push(lastFast);
      if (dayDiff(c.useBy, fU) <= 0) break;   // 无法推进则停止，防死循环
      fU = c.useBy;
    }
    // 末批精确缩减：让末批自然用完日恰落在「主力首批到货日 + safety」= 交接目标，
    // 不按固定桥接量过量采购。批量 = ⌈d×(交接目标−到货日)⌉ − 到货时真实库存 S
    // （首单即末批时 S=carry1 真实剩余；链上末批时 S=safety×d 衔接缓冲）
    // 末批 = 最后一条快补行（续接批可能已降级成别的快通道，不能按 fast.m 过滤，否则末批缩减会漏掉降级批）
    const lastAir = lastFast || lines[0];
    if (lastAir) {
      const targetUB = addDays(slowArrive1, params.safety);   // 交接目标日
      if (dayDiff(lastAir.useBy, targetUB) > 0) {             // 末批自然用完晚于交接目标 → 精确缩
        const isFirst = lines[0] === lastAir;
        const S = isFirst ? carry1 : params.safety * d;
        const need = Math.ceil(d * dayDiff(targetUB, lastAir.arrive) - S);   // 目标天量件 − 到货时已有件，取整
        // 末批上限 = 单批上限 + 一个安全库存量：末批最多比普通批多买一个 safety 的量。
        // 桥接量已受单批上限约束，故 need ≤ 桥接量 + safety×d ≤ capLast 恒成立，此界只是理论兜底。
        if (need > 0 && need <= capLastQty(d, params)) {
          lastAir.qty = need;
          lastAir.useBy = targetUB;
          fU = targetUB;
        } else if (need > 0) {
          lastAir.qty = capLastQty(d, params);   // 异常兜底（理论上不会触发）
        }
      }
    }
    // 快补已覆盖到主力到货日（不再依赖快补）→ 标记衔接成功
    const linked = dayDiff(fU, slowArrive1) >= 0;

    // 主力（慢）周期批：从主力首批到货日接管后每补货周期一批（预排 4 批展示稳态）。
    // 慢批首行 carry = 快补末批用完日超出主力到货日的真实剩余（未触发缩时可能为 0，不乐观高估）
    const slowCarry = lastAir ? Math.max(0, d * dayDiff(lastAir.useBy, slowArrive1)) : 0;
    const slowLines = buildCycleLines(res, params, slow, res.today, 4, slowCarry);
    Array.prototype.push.apply(lines, slowLines);

    lines.linked = linked;
    return lines;
  }

  // —— 首批采购日（贴断点尽量晚）——
  // 断点 = 时间轴首缺口（含现有+在途 ETA 推演）；把首批采购延后到
  //   「断点 − 安全库存 − (提前期+本渠道运输)」，使首批到货日 = 断点 − 安全库存
  //   （到货时手中仍留 safety 天缓冲，不提前占款）；若该日已过则今天。
  function exhaustDate(res) {
    return res.firstGap ? res.firstGap.from : res.rows[res.rows.length - 1].useBy;
  }
  // anchorOverride：阶梯接力时传入「该渠道的锚点」替代默认断点（方案一/二不传，行为不变）
  function firstBuyDate(res, params, chan, anchorOverride) {
    const base = anchorOverride || exhaustDate(res);
    const fp = addDays(base, -(params.safety + params.leadTime + chan.d));
    return fp < res.today ? res.today : fp;
  }

  // —— 每批采购量（渠道区分；均向上取整）——
  // 海运/陆运（慢/主力）：周期批 = 日均×(补货周期 + 安全库存)，简称 batchQty
  // 空运（快）：每批只按 日均×补货周期（不叠安全库存，靠频次+贴断点缓冲），简称空运周期批
  // 单批上限保护（用户规则）：海运单批 > 日均×(周期+安全)×2 → 拆 2 批；空运单批 > 日均×(周期+安全) → 拆 2 批。
  //   = 海运 ≤ 2×(周期+安全) 天量、空运 ≤ (周期+安全) 天量（旧口语「海运18倍/空运8倍」均指日均倍数，实际按上口径取）。
  //   本工具按上表给出单批，天然不越线；若日后把数批合并成一单下，可按此线拆开执行。
  function cycleQty(d, params, method) {
    return method.m === "空运"
      ? Math.ceil(d * Math.max(1, params.cycle))
      : Math.ceil(d * Math.max(1, params.cycle + params.safety));
  }

  // 主通道批序列：首批从 fp（贴断点日）起，之后每「补货周期」下一批，共预排 n 批（周期批）。
  //   到货日 = 采购日 + (提前期+运输)；到货间隔 = 补货周期。
  //   每批预计用完 = 到货日 + (到货时库存 + 本批数量) ÷ d；首行到货时库存用时间轴推演，
  //   之后每批到货时的残留 = 上批剩余 − 期间(周期天)消耗（海运每批覆盖 > 周期，残留逐批累增
  //   = 提前积累的安全垫；空运每批恰覆盖一个周期，残留≈0，靠首批到货时已垫的缓冲衔接）。
  function buildCycleLines(res, params, chan, fp, n, firstCarry) {
    const d = res.d;
    const qty = cycleQty(d, params, chan);
    const transit = params.leadTime + chan.d;
    const lines = [];
    let carry = firstCarry !== undefined ? firstCarry : projectedStock(res, d, addDays(fp, transit));
    for (let i = 0; i < n; i++) {
      const pd = addDays(fp, i * params.cycle);
      const arrive = addDays(pd, transit);
      const useBy = addDays(arrive, (carry + qty) / d);
      lines.push({ purchase: pd, method: chan.m, qty, arrive, useBy, lateDays: 0 });
      carry = Math.max(0, carry + qty - d * params.cycle);   // 到下一批到货时的残留
    }
    lines.qty = qty;
    return lines;
  }

  // 展示裁剪：只保留「采购日 ≤ 今天 + 30 天」的批次（衔接优先，只列出近 30 天真正要下的单），
  // 若 30 天内一批都没有则保留最早 1 批；总行数封顶 8（防大批长链）。
  function trimHorizon(lines, today, horizonDays, maxRows) {
    const h = addDays(today, horizonDays || 30);
    const n = maxRows || 8;
    const kept = [];
    for (const l of lines) {
      if (kept.length >= n) break;
      if (l.purchase <= h) kept.push(l);
    }
    if (!kept.length && lines.length) kept.push(lines[0]);
    for (const k of Object.keys(lines)) if (!/^\d+$/.test(k)) kept[k] = lines[k];   // 迁移附加属性(linked 等)
    return kept;
  }

  // planA：纯单渠道分批。不作为独立方案对外暴露，仅被以下场景复用：
  //   方案一（组合）的 A 档「主力到货前不断货」、E1「在途接得住」、单一渠道退化分支。
  // 首批采购日贴断点（到货 = 断点−安全库存）；之后每补货周期一批（周期批），共预排 N 批。
  function planA(res, params, mainMethod, fpOverride, title) {
    const d = res.d, slow = mainMethod || seaMethod(params);
    const fp = fpOverride || firstBuyDate(res, params, slow);
    const transit = params.leadTime + slow.d;
    const a1 = addDays(fp, transit);
    const allLines = buildCycleLines(res, params, slow, fp, 4);
    const lines = trimHorizon(allLines, res.today);
    const qty = allLines.qty;
    const isAir = slow.m === "空运";

    // 缓冲天数 = 断点 − 首批到货日：负数=到货前已断货，0=贴线，正数=安全
    const buf = dayDiff(res.firstGap.from, a1);
    let risk;
    if (buf < 0) risk = "首批 " + fmtMD(a1) + " 到货前即断货（断点 " + fmtMD(res.firstGap.from) + "），纯" + slow.m + "不可行，需提前采购或加快";
    else if (buf < 1) risk = "首批贴线到货，决策窗口短";
    else risk = "首批到货前不断货（缓冲 " + buf + " 天）";
    const lateParts = [];
    for (const l of lines) if (l.lateDays > 0) lateParts.push("到货 " + fmtMD(l.arrive) + " 的批次晚于上批用完日 " + l.lateDays + " 天");
    if (lateParts.length) risk += "；" + lateParts[0] + "，需加大批量或改用更快渠道";

    const chNote = (slow.m === "海运" && +params.sea <= 0)
      ? "海运未填写（0），按默认 " + SEA_DEFAULT + " 天估算；" : "";
    const fpNote = fp > res.today
      ? "首批延后至 " + fmtMD(fp) + " 采购（贴断点·" + fmtMD(a1) + " 到货 = 断点−安全" + params.safety + "天）"
      : "首批今天下单";
    const qNote = isAir
      ? ("每批 = 日均×补货周期（空运周期批）=" + qty + " 件")
      : ("每批 = 日均×(补货周期+安全库存)（周期批）=" + qty + " 件");
    return { title: title || ("纯" + slow.m + "·分批"),
      note: chNote + "全程只用" + slow.m + "：" + qNote + "，" + fpNote + "；之后每 " + params.cycle + " 天一批，预排 " + lines.length + " 批",
      risk, lines };
  }

  // 方案一（组合·推荐）：快+慢接力，防断货且资金均衡。
  // 若所选物流使组合退化为单一渠道：仅空运 → 与方案二等价（仅引用）；其余直接展开纯渠道明细。
  function planB(res, params) {
    const d = res.d, slow = enabledSlowest(params), fast0 = fastest(params);
    const noMethod = options(params).length === 0
      ? "未填写任何运输方式，按海运 " + SEA_DEFAULT + " 天默认估算；" : "";
    const title = "方案一（组合·推荐）";

    // —— 单一渠道退化：与方案二等价，直接展开、不重复计算 ——
    if (slow.m === fast0.m) {
      if (slow.m === "空运") return { title, collapsedTo: "plan2", note: "同方案二（纯空运·分批）", lines: [] };
      const a0 = planA(res, params, slow, null, title);
      return { title, note: noMethod + "仅" + slow.m + "一种方式可用，等价于纯" + slow.m + "分批：" + a0.note, risk: a0.risk, lines: a0.lines };
    }

    const slowTransit = params.leadTime + slow.d;
    const slowArrive = addDays(res.today, slowTransit);
    // 断点 = 时间轴首个缺货/耗尽日（含现有+在途 ETA）
    const gapFrom = res.firstGap.from;

    // 只要「主力首批到货前不会断货」（断点 ≥ 主力到货日），就无需快补：直接主力周期批，
    // 首批贴断点延后；到货缓冲不足 safety 只影响提示文案，不影响方案结构。
    if (gapFrom >= slowArrive) {
      const a = planA(res, params, slow, null, title);
      const bufDays = dayDiff(gapFrom, slowArrive);        // 主力首批到货时可再撑的天数（到断点）
      // a.note 形如 "全程只用海运：每批=…（周期批）…"；此处取其中「每批=…」起的正文，避免与前半句重复
      const body = a.note.indexOf("每批") >= 0 ? a.note.slice(a.note.indexOf("每批")) : a.note;
      const lead = bufDays >= params.safety
        ? "现有+在途充足，无需快补："
        : ("主力到货前不断货（" + fmtMD(slowArrive) + " 到货时缓冲 " + bufDays + " 天 < 安全库存 " + params.safety + " 天），无需快补：");
      return { title, note: noMethod + lead + "直接" + slow.m + "周期批，" + body, risk: a.risk, lines: a.lines };
    }

    // —— 阶梯接力（主力到货前会断货）——
    // ① 先按「现有+在途」判断是否需要快补：锚点 = 该渠道真正要接的缺口起点（见 ladderAnchor）。
    //    锚点 ≥ 主力首批到货日（E1）→ 在途已能撑到主力到货，不排快补，仅提示催提在途。
    // ② 否则 E2 阶梯接力：快补在「来得及的方式里选最慢者」（优先陆运、其次空运，没填的不参与），
    //    首批贴锚点延后下单；每批桥接量（≤ 单批上限）滚动续接；末批按精确缺口缩减（≤ 单批上限+安全库存量）。
    const picked = pickFast(res, params, slow.m) || { method: fast0, anchor: ladderAnchor(res, params, fast0) };
    const fast = picked.method, anchor = picked.anchor;

    if (dayDiff(anchor, slowArrive) >= 0) {
      const a = planA(res, params, slow, null, title);
      const body = a.note.indexOf("每批") >= 0 ? a.note.slice(a.note.indexOf("每批")) : a.note;
      const g0 = res.firstGap;
      const gapTip = (g0 && g0.to)
        ? "⚠️ 已断货 " + fmtMD(g0.from) + "→" + fmtMD(g0.to) + "（缺约 " + g0.missQty + " 件），由在途接住、建议催提在途；"
        : "";
      // E1 时 planA 的 risk（"纯X不可行"）与"无需快补"结论矛盾，改用断货段提示
      const e1Risk = (g0 && g0.to)
        ? "断货 " + fmtMD(g0.from) + "→" + fmtMD(g0.to) + "（缺约 " + g0.missQty + " 件）由在途接住，建议催提在途；在途到货后可撑到 " + fmtMD(anchor) + "，无需快补"
        : a.risk;
      return { title,
        note: noMethod + gapTip + "在途到货后可撑到 " + fmtMD(anchor) + "（≥ " + slow.m + "首批到货 " + fmtMD(slowArrive) + "），无需快补：" + body,
        risk: e1Risk, lines: a.lines };
    }

    const fpFast = firstBuyDate(res, params, fast, anchor);   // 快补首批采购日（贴锚点，尽量晚）
    const fastArrive = addDays(fpFast, params.leadTime + fast.d);
    const bridge = bridgeQty(d, params, fast).bridge;         // 已受单批上限约束
    const lines = trimHorizon(ladderLines(res, params, fast, slow, anchor), res.today);
    // 快补批 = 所有非主力批（续接批可能已按窗口降级成别的快通道，不能按 fast.m 过滤）
    const fastLns = lines.filter(l => l.method !== slow.m);
    const nFast = fastLns.length;
    const fastSum = fastLns.reduce((s, l) => s + l.qty, 0);
    const unlinked = lines.linked === false
      ? "；⚠️ 快补批次已达上限仍未接上" + slow.m + "，建议启用中间渠道或加大桥接量" : "";
    const slowQty = cycleQty(d, params, slow);
    const slowDesc = (slow.m === "空运")
      ? slow.m + "每批 = 日均×补货周期（空运周期批）" + slowQty + " 件"
      : slow.m + "每批 = 日均×(补货周期+安全库存)（周期批）" + slowQty + " 件";
    const lastAir = fastLns[fastLns.length - 1];
    // 方式混排统计：续接批按窗口降级后可能出现「空运首发 + 陆运续接」，各方式桥接量不同 → 分别列出
    const daysOf = nm => { const c = options(params).filter(x => x.m === nm)[0]; return c ? c.d : fast.d; };
    const byMethod = {};
    for (const l of fastLns) { const o = byMethod[l.method] || (byMethod[l.method] = { n: 0, qty: 0 }); o.n++; o.qty += l.qty; }
    const methodNames = Object.keys(byMethod);
    const perMethodDesc = methodNames.map(m => m + " " + byMethod[m].n + " 批 " + byMethod[m].qty + " 件").join("、");
    const mixed = methodNames.length > 1;   // 快补链上出现了不止一种方式（已发生逐批降级）
    const lastBridge = lastAir ? bridgeQty(d, params, { m: lastAir.method, d: daysOf(lastAir.method) }).bridge : bridge;
    const shrinkNote = lastAir && lastAir.qty < lastBridge ? "，末批按缺口缩至 " + lastAir.qty + " 件" : "";
    // 快补合计描述：nFast=1 且末批已按缺口缩量 → 直接说清「基准桥接量→实际缩量」；
    // 多批 → 每批桥接量基准，末尾若缩量则附注。避免「每批4504…共1批2499件（缩至2499）」式冗余。
    const batchDesc = mixed
      ? ("：" + perMethodDesc + "（每批按该方式桥接量" + shrinkNote + "）")
      : ((nFast === 1 && lastAir && lastAir.qty < bridge)
        ? ("共 1 批 " + lastAir.qty + " 件（桥接量基准 " + bridge + " 件/批，按缺口缩量至仅撑到" + slow.m + "首批到货+安全库存）")
        : ("每批 " + bridge + " 件（桥接量·仅覆盖提前期+安全+运输）共 " + nFast + " 批（" + fastSum + " 件" + shrinkNote + "）"));
    const methodLabel = mixed ? methodNames.join("→") + " 快补（按窗口逐批降级）" : fast.m + "快补";
    const headNote = methodLabel + batchDesc + "，补到" + slow.m + "首批到货为止、到货即交接；" + slowDesc + "、到货即接管，之后不再快补";

    // 不可避免断货段：快补到货日之前的缺口救不了，如实报出并提示催提在途。
    // 区间 = 断点 → min(在途到货日, 快补到货日)：快补先到则只断到快补到货日，
    // 不能用 firstGap.missQty（那是"完全不采购"的缺量，快补到货后已大幅缩减）。
    const g = res.firstGap;
    let missSeg = "";
    if (g && g.from < fastArrive) {
      const segEnd = (g.to && g.to < fastArrive) ? g.to : fastArrive;
      const segQty = Math.ceil(d * dayDiff(segEnd, g.from));
      if (segQty > 0) missSeg = "⚠️ 已发生断货 " + fmtMD(g.from) + "→" + fmtMD(segEnd) + "（缺约 " + segQty + " 件），该段快补赶不上，建议催提在途";
    }
    const fpNote = fpFast > res.today
      ? "首批延后至 " + fmtMD(fpFast) + " 采购（贴缺口起点·" + fmtMD(fastArrive) + " 到货 = " + fmtMD(anchor) + " 前 " + params.safety + " 天）"
      : "今天下单（最早 " + fmtMD(fastArrive) + " 到货）";

    const leadDays = dayDiff(anchor, fastArrive);     // 快补到货距缺口起点的天数
    if (leadDays > 0) {
      const tightRisk = leadDays < params.safety
        ? "⚠️ " + fast.m + "到货距缺口起点仅 " + leadDays + " 天（< 安全库存 " + params.safety + " 天），延误即断货，建议催提在途" : "";
      const risk = [missSeg, tightRisk].filter(Boolean).join("；");
      return { title,
        note: noMethod + fast.m + "可在缺口前到货：" + fpNote + "，" + headNote + (missSeg ? "；" + missSeg : ""),
        risk, lines };
    }
    const stockoutQty = leadDays < 0 ? Math.ceil(d * -leadDays) : 0;
    return { title,
      note: "缺口起点太近，" + fast.m + "今天下单也要 " + fmtMD(fastArrive) + " 才到货（缺口起点 " + fmtMD(anchor) + "）：今日同时下「" + fast.m + "」「" + slow.m + "」两单做阶梯接力，" + headNote + (missSeg ? "；" + missSeg : ""),
      risk: (stockoutQty > 0
        ? "预计断货 " + fmtMD(anchor) + "→" + fmtMD(fastArrive) + "，缺货约 " + stockoutQty + " 件；建议立即催提在途或加价更快渠道" + unlinked
        : "⚠️ " + fast.m + "到货日与缺口起点同日（贴线到货），延误 1 天即断货，建议催提在途") + (missSeg ? "；" + missSeg : ""),
      lines };
  }

  // 方案二（纯空运·分批）：应急/最快基准，仅强制空运，不管其他渠道是否填写。
  // 空运未填(0)时回退默认 5 天；首批延后到贴断点（firstBuyDate）。
  function planAir(res, params) {
    const filled = +params.air > 0;
    const airDays = filled ? +params.air : AIR_DEFAULT;
    const airMethod = { m: "空运", d: airDays };
    const a = planA(res, params, airMethod, null, "方案二（纯空运·分批）");
    const warn = filled ? "" : "（空运运输天数未填写，按默认 " + AIR_DEFAULT + " 天估算）";
    return { title: "方案二（纯空运·分批）",
      note: warn + a.note,
      risk: a.risk, lines: a.lines };
  }

  /* ---------- Markdown ---------- */
  function toMarkdown(res, plans, params) {
    const d = res.d;
    let md = "===SKU:" + (res.sku.code || "未命名") + "===\n\n";
    md += "**库存状态**：" + res.status + "（" + res.statusNote + "）";
    if (res.trend) md += "；" + res.trend;
    md += "\n\n";
    md += "日均30天 " + res.sku.daily30 + " ｜ 日均7天 " + res.sku.daily7 + " ｜ 日均变化率 " + (res.sku.changeRate > 0 ? "+" : "") + res.sku.changeRate + "%\n\n";
    if (res.pickupAlert) {
      md += res.pickupAlert + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "\n\n";
    }
    md += "**库存时间轴**：\n";
    md += "| 采购 | 方式 | 数量 | 预计到货 | 预计用完 |\n|---|---|---|---|---|\n";
    md += "| — | — | 当前库存 " + res.rows[0].qty + " 件 | — | " + fmtMD(res.rows[0].useBy)
      + (res.rows[0].gap ? " 🔴断货 " + fmtMD(res.rows[0].gap.from) + "→" + fmtMD(res.rows[0].gap.to) + " 缺 " + res.rows[0].gap.missQty + " 件" : "")
      + (res.rows[0].endGap ? " 🔴断货 " + fmtMD(res.rows[0].endGap.from) + " 起（无后续到货）" : "") + " |\n";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? fmtMD(parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = fmtMD(r.arrive) + " (逾期未提货)";
      else if (r.tight) arrive = fmtMD(r.arrive) + " ⚠️贴线";
      else arrive = fmtMD(r.arrive);
      const gap = r.gap ? " 🔴断货 " + fmtMD(r.gap.from) + "→" + fmtMD(r.gap.to) + " 缺 " + r.gap.missQty + " 件" : "";
      const endM = r.endGap ? " 🔴断货 " + fmtMD(r.endGap.from) + " 起（无后续到货）" : "";
      md += "| " + pd + " | " + r.method + " | " + r.qty + " | " + arrive + " | " + fmtMD(r.useBy) + gap + endM + " |\n";
    }
    if (res.anomaly.length) {
      md += "\n⚠️ 以下在途批次未纳入计算：\n";
      for (const a of res.anomaly) md += "  - " + (a.method || "未知方式") + " " + a.qty + " 件（" + a.reason + "）\n";
    }
    md += "\n**采购方案**：\n";
    for (const p of plans) {
      md += "\n- **" + p.title + "**：" + p.note + (p.risk ? "（" + p.risk + "）" : "") + "\n";
      for (const l of p.lines) md += "  - " + fmtMD(l.purchase) + "采购，" + l.method + l.qty + "件，预计到货" + fmtMD(l.arrive) + "，预计用完 " + fmtMD(l.useBy) + "\n";
    }
    return md;
  }

  return { parse, analyze, planA, planB, planAir, toMarkdown, fmt, fmtMD, parseDate };
})();

/* ============================================================
 * UI 层（仅测试用，接入网站时只保留上面模块即可）
 * ============================================================ */
function getParams() {
  return {
    cycle: +document.getElementById("p-cycle").value,
    leadTime: +document.getElementById("p-lead").value,
    safety: +document.getElementById("p-safety").value,
    sea: +document.getElementById("p-sea").value,
    land: +document.getElementById("p-land").value,
    air: +document.getElementById("p-air").value,
  };
}
function getBaseDate() {
  const v = document.getElementById("p-base").value;
  return v ? new Date(v) : new Date();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
/* 术语浮动注释：给 .tip 元素绑定 hover 浮层（支持多行 br，不裁剪、不随滚动偏移） */
function bindTips(rootEl) {
  if (!rootEl) return;
  rootEl.querySelectorAll(".tip").forEach(el => {
    el.addEventListener("mouseenter", function () {
      const box = document.createElement("div");
      box.className = "tipbox";
      box.innerHTML = el.getAttribute("data-tip") || "";
      document.body.appendChild(box);
      const r = el.getBoundingClientRect();
      const tw = box.offsetWidth;
      let left = r.left;
      if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
      box.style.left = left + "px";
      box.style.top = (r.bottom + 6) + "px";
      el._box = box;
    });
    el.addEventListener("mouseleave", function () { if (el._box) { el._box.remove(); el._box = null; } });
  });
}


/* 计算说明面板：参数定义 / 公式 / 方案逻辑，数值随填写值实时变化；术语带 hover 浮动注释 */

    + "</tr>" + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</table>";
  const mth = (d, extra) => d > 0 ? V(d + " 天") : V("0") + "（未启用" + (extra || "") + "）";

  const escAttr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const T = (txt, tip) => '<span class="tip" data-tip="' + escAttr(tip) + '">' + txt + "</span>";

  let h = "<h3>一、参数定义 <span style='color:var(--muted);font-weight:400;font-size:12px'>（鼠标移到带下划线的术语可查看浮动注释）</span></h3>";
  h += tbl(["参数", "当前值", "说明"], [
    ["基准日 base", V(base), "一切日期的起算点；最早采购日 = 基准日，输出中" + T("不出现过去日期", "任何采购日 / 最迟采购日都不会早于基准日；若最迟节点已过，只提示「须立即下单」而不显示历史日期")],
    [T("补货周期 cycle", "相邻两批的采购间隔天数；同时也是单批库存要覆盖的天数基准"), V(p.cycle + " 天"), "滚动下单间隔；同时是单批覆盖天数的基准"],
    [T("采购提前期 leadTime", "下单之后、到供应商实际发货之间的准备天数（如备货、报关）"), V(p.leadTime + " 天"), "下单 → 供应商发货的准备时间"],
    [T("安全库存 safety", "每批到货时希望手里仍保留的库存天数，用于吸收运输延误与销量波动"), V(p.safety + " 天"), "每批到货时应保留的缓冲库存天数"],
    [T("海运 sea", "海运的运输时效（天）。填 0 表示本次不用海运"), mth(p.sea, "；三种全填 0 时按默认 30 天估算"), "0 = 本次不用该方式"],
    [T("陆运 land", "陆运的运输时效（天）"), mth(p.land), "0 = 本次不用该方式"],
    [T("空运 air", "空运的运输时效（天）。填 0 时方案二按默认 5 天估算"), mth(p.air, "；方案二仍按默认 5 天估算"), "0 = 本次不用该方式"],
  ]);
  h += '<div class="note">三种运输方式<b>默认 海运30天 / 陆运7天 / 空运5天</b>。填 0 = 该渠道本次不用（不参与' + T("方案一（组合）", "主力 = 已启用方式中最慢者；快补 = 主力之外「来得及」的最慢者（优先陆运、其次空运）；三种全 0 时回退海运 30 天") + '）；' + T("方案二恒按空运", "方案二强制只用空运，空运 0 则取默认 5 天（应急基准，与是否填写无关）") + '。</div>';
  h += '<div class="note">⚠️ 安全库存口径：当前为固定 ' + p.safety + ' 天缓冲，未计入销量波动与运输延误分布。若日销波动大，建议按 Z × σ × √(提前期+运输天数) 估算后回填本参数（待优化）。</div>';

  h += "<h3>二、输入字段定义</h3>";
  h += tbl(["输入字段", "含义", "说明"], [
    [T("日均7天 d", "最近 7 天日销量均值，全表统一的消耗口径；缺失时用「销量7天 ÷ 7」推导"), "统一消耗口径", "所有「预计用完」「断货」计算都用它"],
    ["可用库存", "当前可售库存", "时间轴起点"],
    [T("在途", "已采购、尚未到货的批次；其预计到货参与时间轴推演") + "批次", "已采购未到货", "必须有" + T("预计到货", "批次预计送达日期，须为 4 位年份 YYYY-MM-DD，否则列为异常不参与") + "且为 4 位年份才纳入计算"],
    [T("日均变化率", "日均7天相对日均30天的涨跌幅度"), "日均7天 vs 日均30天", "绝对值 > 10% 时输出趋势提示，不参与计算"],
  ]);

  h += "<h3>三、基础计算公式</h3>";
  h += tbl(["计算项", "公式", "说明"], [
    ["可售天数", "可用库存 ÷ " + T("d", "日均7天") , "低于" + T("补货周期", "相邻两批采购间隔，见参数定义") + " → 红字「需立即提货」"],
    [T("海运/陆运周期批（滚动批）", "海运、陆运每批标准量 = ⌈日均×(补货周期+安全库存)⌉；每批到货覆盖一个周期+缓冲，管道由「提前下单」填充，与运输时长无关"), "⌈d × (补货周期 + 安全库存)⌉ = ⌈d × " + (p.cycle + p.safety) + "⌉", "海运/陆运每批"],
    [T("空运周期批", "空运每批只按 ⌈日均×补货周期⌉（快、频次高，不再叠安全库存；首批到货时已留缓冲垫）"), "⌈d × 补货周期⌉ = ⌈d × " + p.cycle + "⌉", "空运每批"],

function run() {
  const out = document.getElementById("output");
  const params = getParams();
  const base = getBaseDate();
  const text = document.getElementById("input").value;
  renderCalcDoc();
  const skus = ReplenishModule.parse(text);
  if (!skus.length) { out.innerHTML = '<div class="err">未识别到 SKU 数据，请检查输入格式。</div>'; return; }

  const tally = { 紧急: 0, 注意: 0, 充足: 0 };
  let html = "";
  for (const sku of skus) {
    const res = ReplenishModule.analyze(sku, params, base);
    if (res.error) { html += '<div class="sku-card"><div class="err">' + esc(res.error) + "</div></div>"; continue; }
    const plans = [ReplenishModule.planB(res, params), ReplenishModule.planAir(res, params)];
    const md = ReplenishModule.toMarkdown(res, plans, params);
    const badge = res.status === "充足" ? "green" : res.status === "注意" ? "orange" : "red";
    tally[res.status] = (tally[res.status] || 0) + 1;

    // 默认收起，点击标题展开/收起
    html += '<details class="sku-card">';
    html += '<summary><span class="sku-title">' + esc(sku.code || "未命名") + '</span><span class="badge ' + badge + '">' + res.status + "</span>";
    html += '<span class="sum-meta">' + esc(res.statusNote) + " ｜ 日均7天 " + sku.daily7 + " ｜ 可用 " + res.rows[0].qty + " 件" + (res.pickupAlert ? " ｜ 需提货" : "") + "</span>";
    html += '<button class="copy-btn" data-md="' + esc(md.replace(/\n/g, "\\n")) + '" onclick="event.stopPropagation();event.preventDefault();copyMd(this)">复制 Markdown</button></summary>';
    html += '<div class="sku-body">';
    html += '<div class="status-line">SKU: ' + esc(sku.code || "未命名") + " ｜ " + esc(res.statusNote) + (res.trend ? "；" + esc(res.trend) : "") + "</div>";
    html += '<div class="status-line">日均30天 ' + sku.daily30 + ' ｜ 日均7天 ' + sku.daily7 + ' ｜ 日均变化率 ' + (sku.changeRate > 0 ? "+" : "") + sku.changeRate + "%</div>";

    if (res.pickupAlert) {
      html += '<div class="warn">' + esc(res.pickupAlert) + (res.overdue.length ? "（存在逾期批次，优先催提）" : "") + "</div>";
    }

    html += "<table><tr><th>采购</th><th>方式</th><th>数量</th><th>预计到货</th><th>预计用完</th></tr>";
    html += "<tr><td>—</td><td>—</td><td>当前库存 " + res.rows[0].qty + " 件</td><td>—</td><td>" + ReplenishModule.fmtMD(res.rows[0].useBy)
      + (res.rows[0].gap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(res.rows[0].gap.from) + "→" + ReplenishModule.fmtMD(res.rows[0].gap.to) + " 缺 " + res.rows[0].gap.missQty + " 件</span>" : "")
      + (res.rows[0].endGap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(res.rows[0].endGap.from) + " 起（无后续到货）</span>" : "") + "</td></tr>";
    for (let i = 1; i < res.rows.length; i++) {
      const r = res.rows[i];
      const pd = r.purchaseDate ? ReplenishModule.fmtMD(ReplenishModule.parseDate(r.purchaseDate)) : "—";
      let arrive;
      if (r.kind === "overdue") arrive = '<td>' + ReplenishModule.fmtMD(r.arrive) + ' <span style="color:var(--red)">(逾期未提货)</span></td>';
      else if (r.tight) arrive = '<td class="gap">' + ReplenishModule.fmtMD(r.arrive) + " ⚠️贴线</td>";
      else arrive = "<td>" + ReplenishModule.fmtMD(r.arrive) + "</td>";
      const useByStr = ReplenishModule.fmtMD(r.useBy);
      const gapMark = r.gap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(r.gap.from) + "→" + ReplenishModule.fmtMD(r.gap.to) + " 缺 " + r.gap.missQty + " 件</span>" : "";
      const endMark = r.endGap ? ' <span style="color:var(--red);font-weight:600">🔴断货 ' + ReplenishModule.fmtMD(r.endGap.from) + " 起（无后续到货）</span>" : "";
      html += "<tr><td>" + pd + "</td><td>" + esc(r.method) + "</td><td>" + r.qty + "</td>" + arrive + "<td>" + useByStr + gapMark + endMark + "</td></tr>";
    }
    html += "</table>";
    if (res.anomaly.length) {
      html += '<div class="warn">⚠️ 以下 ' + res.anomaly.length + ' 批在途未纳入计算：</div><ul style="color:#d93025;font-size:13px;margin:2px 0 0 18px;padding:0">';
      for (const a of res.anomaly) html += "<li>" + esc(a.method || "未知方式") + " " + a.qty + " 件（" + esc(a.reason) + "）</li>";
      html += "</ul>";
    }

    for (const p of plans) {
      html += '<div class="plan"><h4>' + esc(p.title) + "</h4>";
      html += '<div class="note">' + esc(p.note) + "</div>";
      if (p.risk) html += '<div class="note risk">' + esc(p.risk) + "</div>";
      if (p.lines.length) {
        html += "<ol>";
        const seenMethod = {};
        for (const l of p.lines) {
          const firstOf = !seenMethod[l.method];
          seenMethod[l.method] = true;
          const pd = ReplenishModule.fmtMD(l.purchase);
          html += "<li>" + (firstOf ? '<b style="color:var(--red)">' + pd + "</b>" : pd) + "采购，"
            + esc(l.method) + l.qty + "件，预计到货" + ReplenishModule.fmtMD(l.arrive) + "，预计用完 " + ReplenishModule.fmtMD(l.useBy) + "</li>";
        }
        html += "</ol>";
      }
      html += "</div>";
    }
    html += "</div></details>";
  }

  const bar = '<div class="tally-bar">共 ' + skus.length + " 个 SKU："
    + '<span class="badge red">紧急 ' + (tally.紧急 || 0) + "</span> "
    + '<span class="badge orange">注意 ' + (tally.注意 || 0) + "</span> "
    + '<span class="badge green">充足 ' + (tally.充足 || 0) + "</span>"
    + '<button class="copy-btn" onclick="toggleAll(true)">全部展开</button>'
    + '<button class="copy-btn" onclick="toggleAll(false)">全部收起</button></div>';
  out.innerHTML = bar + html;
}

function toggleAll(open) {
  document.querySelectorAll("#output details.sku-card").forEach(d => { d.open = open; });
}

function copyMd(btn) {
  const md = btn.getAttribute("data-md").replace(/\\n/g, "\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制 Markdown", 1500); });
  } else {
    const ta = document.createElement("textarea"); ta.value = md; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); btn.textContent = "已复制";
  }
}
